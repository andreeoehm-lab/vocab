<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Deutschlandkarte – Länder &amp; Hauptstädte (OEM)</title>
<style>
:root{
  --board:#20382f; --board2:#2a483d; --chalk:#f3efe2; --accent:#f2c14e;
  --land:#efe6cf; --ok:#7ccf8e; --bad:#e5604f; --ink:#1b2a24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 30% 20%,var(--board2),var(--board));
  color:var(--chalk);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;
}
header{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:8px 16px;background:rgba(0,0,0,.22);border-bottom:2px solid rgba(255,255,255,.12);
}
h1{font-size:clamp(18px,1.7vw,26px);margin:0;font-weight:700;letter-spacing:.2px}
h1 .tag{font-size:.55em;font-weight:700;background:var(--accent);color:#2b2208;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:middle}
.seg{display:flex;border:2px solid rgba(255,255,255,.35);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--chalk);font:inherit;font-size:clamp(14px,1.4vw,19px);padding:8px 16px;cursor:pointer}
.seg button.on{background:var(--accent);color:#2b2208;font-weight:700}
.stats{display:flex;gap:16px;margin-left:auto;font-size:clamp(15px,1.5vw,22px);font-variant-numeric:tabular-nums}
.stats b{color:var(--accent)}
.btns{display:flex;gap:8px}
.btn{border:2px solid rgba(255,255,255,.35);background:transparent;color:var(--chalk);font:inherit;font-size:clamp(14px,1.3vw,18px);
  padding:7px 14px;border-radius:12px;cursor:pointer}
.btn:active{background:rgba(255,255,255,.15)}
.btn.on{background:rgba(242,193,78,.25);border-color:var(--accent)}
main{flex:1;min-height:0;display:flex}
.mapwrap{flex:1;min-width:0;display:flex;padding:8px}
svg{width:100%;height:100%}
aside{width:clamp(280px,27vw,420px);background:rgba(0,0,0,.18);border-left:2px solid rgba(255,255,255,.12);
  padding:12px;display:flex;flex-direction:column;min-height:0}
aside h2{margin:0 0 4px;font-size:clamp(15px,1.4vw,20px);font-weight:600;opacity:.9}
aside p{margin:0 0 10px;font-size:clamp(12px,1.05vw,15px);opacity:.7;line-height:1.35}
#chips{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;overflow:auto;flex:1;padding:2px}
.chip{
  background:var(--chalk);color:var(--ink);border-radius:10px;padding:8px 13px;
  font-size:clamp(15px,1.5vw,22px);font-weight:600;cursor:grab;touch-action:none;
  box-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .15s,opacity .3s,background .15s;
}
.chip.C{background:#ffe3a8}
#chips.seq{align-content:center;justify-content:center}
#chips.seq .chip{font-size:clamp(24px,3vw,42px);padding:18px 30px;border-radius:16px}
.chip.sel{outline:4px solid var(--accent);transform:translateY(-2px) scale(1.05)}
.chip.dragging{opacity:.3}
.chip.gone{opacity:0;transform:scale(.6)}
.chip.shake{animation:shake .4s}
.chip.pulse{animation:cpulse .5s 3}
.chip.ghostdrag{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-120%) scale(1.1);box-shadow:0 8px 18px rgba(0,0,0,.45);opacity:.95}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes cpulse{50%{background:#fff;transform:scale(1.12)}}

/* Karte */
.st{fill:var(--land);stroke:#6b5b3e;stroke-width:1.1;stroke-linejoin:round;cursor:pointer;transition:fill .25s}
@media (hover:hover){.st:hover{fill:#f8f1dc}.ring:hover{fill:rgba(255,255,255,.6)}}
.st.ok,.ring.ok{fill:var(--ok)}
.st.half,.ring.half{fill:#cfe9c0}
.st.hov,.ring.hov{fill:#ffe9a8}
.st.sel{stroke:#e0a100;stroke-width:3.2}
.ring.sel{stroke:#e0a100;stroke-width:3.2;stroke-dasharray:none}
.st.bad,.ring.bad{animation:bad .6s}
.st.pulse,.ring.pulse{animation:spulse .5s 3}
@keyframes bad{0%,55%{fill:var(--bad)}}
@keyframes spulse{50%{fill:#ffd24d}}
.ring{fill:rgba(255,255,255,.35);stroke:#5a4a2a;stroke-dasharray:3 3;stroke-width:1.5;cursor:pointer;transition:fill .25s}
.leader{stroke:var(--chalk);stroke-width:1.2;opacity:.75}
.dot{fill:#fff;stroke:#222;stroke-width:1.3;pointer-events:none;transition:fill .3s}
.dot.on{fill:#222}
.lbl,.clbl,.olbl{pointer-events:none;opacity:0;transition:opacity .35s;font-weight:700}
.lbl{fill:var(--ink);stroke:rgba(255,255,255,.75);stroke-width:3.2;paint-order:stroke;stroke-linejoin:round;text-anchor:middle}
.clbl{fill:#6a1b00;stroke:rgba(255,255,255,.8);stroke-width:3;paint-order:stroke;stroke-linejoin:round;font-size:12px}
.olbl{fill:var(--chalk);font-size:15px}
.on{opacity:1}
.gh{opacity:.65}
.gh.olbl,.olbl.gh{fill:#ffb4a8}
.lbl.gh{fill:#a3271b}
[data-mode="land"] .k-C{display:none}
[data-mode="cap"] .k-L{display:none}

#win{position:fixed;inset:0;background:rgba(10,20,16,.75);display:none;align-items:center;justify-content:center;z-index:100}
#win.show{display:flex}
#win .box{background:var(--chalk);color:var(--ink);border-radius:22px;padding:34px 48px;text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.5)}
#win h2{margin:0 0 10px;font-size:clamp(28px,4vw,52px)}
#win p{margin:6px 0 20px;font-size:clamp(18px,2vw,28px)}
#win .btn{color:var(--ink);border-color:var(--ink);font-size:20px;padding:10px 26px;margin:0 6px}

@media (max-aspect-ratio:1/1){
  main{flex-direction:column}
  aside{width:auto;border-left:0;border-top:2px solid rgba(255,255,255,.12);max-height:38vh}
}
</style>
</head>
<body data-mode="land">
<header>
  <h1>Deutschland: Länder &amp; Hauptstädte<span class="tag">OEM</span></h1>
  <div class="seg" id="seg">
    <button data-m="land" class="on">Bundesländer</button>
    <button data-m="cap">Hauptstädte</button>
    <button data-m="both">Beides</button>
  </div>
  <div class="seg" id="seg2">
    <button data-o="all" class="on">Alle auf einmal</button>
    <button data-o="seq">Nacheinander (zufällig)</button>
  </div>
  <div class="stats">
    <span>Richtig: <b id="prog">0/16</b></span>
    <span>Fehler: <b id="err">0</b></span>
    <span>⏱ <b id="time">00:00</b></span>
  </div>
  <div class="btns">
    <button class="btn" id="hint">💡 Tipp</button>
    <button class="btn" id="sol">Lösung</button>
    <button class="btn" id="reset">↻ Neu</button>
    <button class="btn" id="fs">⛶</button>
  </div>
</header>
<main>
  <div class="mapwrap"><svg id="map" viewBox="15 25 745 820" preserveAspectRatio="xMidYMid meet"></svg></div>
  <aside>
    <h2 id="ptitle">Ländernamen</h2>
    <p id="ptext">Namen ziehen oder antippen, dann das passende Bundesland auf der Karte antippen. (★ = Hauptstadt)</p>
    <div id="chips"></div>
    <button class="btn" id="skip" style="display:none;margin-top:10px">Überspringen ⏭</button>
  </aside>
</main>
<div id="win"><div class="box">
  <h2>🎉 Geschafft!</h2>
  <p id="wtxt"></p>
  <button class="btn" id="again">Nochmal</button>
</div></div>

function buildMap(){

}

function buildChips(){
  const box=$('chips'); box.innerHTML=''; box.classList.toggle('seq',seq);
  const list=seq?items.filter(i=>!i.done).slice(0,1):items;
  if(seq) selChip=list[0]||null;
  list.forEach(it=>{
    const d=document.createElement('div');
    d.className='chip '+it.kind;
    d.textContent=(it.kind==='C'?'★ ':'')+it.text;
    it.el=d; bindChip(d,it); box.appendChild(d);
  });
}

function stateAt(x,y){
  for(const e of document.elementsFromPoint(x,y)){ const sid=e.getAttribute&&e.getAttribute('data-sid'); if(sid) return sid; }
  return null;
}
function setHov(sid){ STATES.forEach(s=>s.hit.forEach(h=>h.classList.toggle('hov',s.id===sid))); }

function bindChip(d,it){
  let sx,sy,pid=null,drag=false,ghost=null;
  const end=()=>{ if(ghost){ghost.remove();ghost=null;} d.classList.remove('dragging'); setHov(null); pid=null; drag=false; };
  d.addEventListener('pointerdown',e=>{
    if(it.done||pid!==null)return; pid=e.pointerId; sx=e.clientX; sy=e.clientY; drag=false;
    try{d.setPointerCapture(pid);}catch(_){}
  });
  d.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid)return;
    if(!drag&&Math.hypot(e.clientX-sx,e.clientY-sy)>10){
      drag=true; startTimer(); ghost=d.cloneNode(true); ghost.className='chip '+it.kind+' ghostdrag';
      document.body.appendChild(ghost); d.classList.add('dragging');
    }
    if(drag){ ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px'; setHov(stateAt(e.clientX,e.clientY)); }
  });
  d.addEventListener('pointerup',e=>{
    if(e.pointerId!==pid)return;
    const wasDrag=drag, sid=wasDrag?stateAt(e.clientX,e.clientY):null;
    end();
    if(wasDrag){ if(sid) place(it,sid); } else clickChip(it);
  });
  d.addEventListener('pointercancel',end);
}

function clickChip(it){
  if(it.done)return; startTimer();
  if(selState){ place(it,selState); return; }
  if(seq){ selChip=it; render(); return; }
  selChip=(selChip===it)?null:it; render();
}
function clickState(sid){
  const s=byId[sid];
  if(selChip){ place(selChip,sid); return; }
  if(kinds().every(k=>s.done[k]))return;
  selState=(selState===sid)?null:sid; render();
}
svg.addEventListener('click',e=>{ const sid=e.target.getAttribute&&e.target.getAttribute('data-sid'); if(sid) clickState(sid); });

function flash(sid){
  const s=byId[sid];
  s.hit.forEach(h=>{h.classList.remove('bad');void h.getBoundingClientRect();h.classList.add('bad');setTimeout(()=>h.classList.remove('bad'),650);});
}
function place(it,sid){
  if(it.done)return; startTimer();
  if(it.id===sid){
    it.done=true; byId[sid].done[it.kind]=true; placed++;
    it.el.classList.add('gone'); const e=it.el; setTimeout(()=>e.remove(),350);
    selChip=selState=null; render();
    if(placed===total) win();
    else if(seq) setTimeout(()=>{buildChips();render();},380);
  } else {
    errors++; flash(sid);
    it.el.classList.add('shake'); const e=it.el; setTimeout(()=>e.classList.remove('shake'),450);
    selChip=selState=null; if(seq) selChip=it; render();
  }
}

function render(){
  const ks=kinds();
  STATES.forEach(s=>{
    const all=ks.every(k=>s.done[k]), some=ks.some(k=>s.done[k]);
    s.hit.forEach(h=>{
      h.classList.toggle('ok',all); h.classList.toggle('half',!all&&some);
      h.classList.toggle('sel',selState===s.id);
    });
    s.dot.classList.toggle('on',s.done.C||(sol&&ks.includes('C')));
    const showL=ks.includes('L'), showC=ks.includes('C');
    if(s.outT){
      const L=s.done.L||(sol&&showL), C=s.done.C||(sol&&showC);
      s.outT.textContent=(L||C)?s.name+(C?' ★':''):'';
      s.outT.classList.toggle('on',s.done.L||s.done.C);
      s.outT.classList.toggle('gh',!(s.done.L||s.done.C)&&sol);
    }
    if(s.nameT){ s.nameT.classList.toggle('on',s.done.L); s.nameT.classList.toggle('gh',!s.done.L&&sol); }
    if(s.capT){ s.capT.classList.toggle('on',s.done.C); s.capT.classList.toggle('gh',!s.done.C&&sol); }
  });
  items.forEach(it=>it.el&&it.el.classList.toggle('sel',it===selChip));
  $('prog').textContent=placed+'/'+total; $('err').textContent=errors;
}

function startTimer(){
  if(t0)return; t0=Date.now();
  tick=setInterval(()=>{$('time').textContent=fmt(Date.now()-t0);},500);
}
function stopTimer(){ clearInterval(tick); tick=null; }
function fmt(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

function win(){
  stopTimer(); const t=fmt(Date.now()-t0); $('time').textContent=t;
  $('wtxt').textContent='Zeit: '+t+' · Fehler: '+errors;
  setTimeout(()=>$('win').classList.add('show'),500);
}

function hint(){
  if(selChip){ const s=byId[selChip.id]; pulse(s.hit); }
  else if(selState){ items.filter(i=>!i.done&&i.id===selState).forEach(i=>pulseChip(i.el)); }
  else { const it=items.find(i=>!i.done); if(it){ selChip=it; render(); it.el.scrollIntoView({block:'nearest'}); } }
}
function pulse(list){ list.forEach(h=>{h.classList.remove('pulse');void h.getBoundingClientRect();h.classList.add('pulse');setTimeout(()=>h.classList.remove('pulse'),1600);}); }
function pulseChip(c){ c.classList.remove('pulse');void c.offsetWidth;c.classList.add('pulse');setTimeout(()=>c.classList.remove('pulse'),1600); }

$('seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return; mode=b.dataset.m;
  [...$('seg').children].forEach(x=>x.classList.toggle('on',x===b)); newGame();
});
$('seg2').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return; seq=b.dataset.o==='seq';
  [...$('seg2').children].forEach(x=>x.classList.toggle('on',x===b)); newGame();
});
$('skip').onclick=()=>{
  const i=items.findIndex(x=>!x.done); if(i<0)return;
  const [it]=items.splice(i,1); items.push(it); buildChips(); render();
};
$('reset').onclick=newGame; $('again').onclick=newGame;
$('hint').onclick=hint;
$('sol').onclick=()=>{ sol=!sol; $('sol').classList.toggle('on',sol); render(); };
$('fs').onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); };

buildMap(); newGame();
</script>
</body>
