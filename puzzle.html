@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --panel:#1b2420; --ink:#e8eee9; --muted:#97a69e; --line:#2c3832;
  --accent:#ea7440; --accent-ink:#1a0f09; --logo:#6cb8de; --well:#0a0e0c; --leaf:#7fb36a; --hi:#3a2519; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --panel:#1b2420; --ink:#e8eee9; --muted:#97a69e; --line:#2c3832;
  --accent:#ea7440; --accent-ink:#1a0f09; --logo:#6cb8de; --well:#0a0e0c; --leaf:#7fb36a; --hi:#3a2519; color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:12px}

header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(22px,2.6vw,36px);letter-spacing:-.015em;line-height:1.05;cursor:default;-webkit-touch-callout:none}
h1 .cjd{color:var(--accent)}
.logo{display:block;height:46px;width:auto;color:var(--logo);flex:none}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}

.sizes{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.sizes button{font:700 16px/1 var(--ui);font-variant-numeric:tabular-nums;color:var(--muted);background:none;border:0;
  min-width:52px;min-height:42px;padding:0 10px;border-radius:999px;cursor:pointer}
.sizes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sizes button:focus-visible,.btn:focus-visible,.name-in:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums;padding:0 4px}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat span{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stat b{font:800 22px/1.1 var(--display)}

.btn{font:700 16px/1 var(--ui);min-height:46px;padding:0 18px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:active{transform:translateY(1px)}

.main{flex:1;min-height:0;display:flex;gap:16px}

/* leaderboard */
.scores{flex:0 0 clamp(210px,18vw,270px);min-width:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px}
.scores h2{margin:0;font:800 22px/1 var(--display);letter-spacing:-.01em;cursor:default}
.lvl{display:flex;flex-direction:column;gap:3px;padding-top:8px;border-top:1px solid var(--line)}
.lvl-h{display:flex;justify-content:space-between;align-items:baseline;font:800 15px/1.2 var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.lvl.cur .lvl-h{color:var(--accent)}
.lvl.cur .lvl-h::after{content:"aktuell";font:700 10px/1 var(--ui);letter-spacing:.09em;text-transform:uppercase}
.row{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;padding:3px 6px;border-radius:7px;font-variant-numeric:tabular-nums;min-height:28px}
.row .rk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--ui);color:#fff}
.row:nth-child(2) .rk{background:var(--gold)} .row:nth-child(3) .rk{background:var(--silver)} .row:nth-child(4) .rk{background:var(--bronze)}
.row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.row .tm{font-weight:700}
.row.empty .nm,.row.empty .tm{color:var(--muted);font-weight:400}
.row.fresh{background:var(--hi);animation:fresh 1.2s ease 2}
@keyframes fresh{50%{box-shadow:0 0 0 2px var(--accent)}}
.reset{margin-top:auto;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.reset .btn{min-height:34px;padding:0 12px;font-size:13px}

.stage{flex:1;min-width:0;min-height:0;position:relative;display:grid;place-items:center}
.board{position:relative;background:var(--well);border-radius:10px;overflow:hidden;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.45),0 0 0 1px var(--line)}
.tile{position:absolute;left:0;top:0;cursor:pointer;will-change:transform;
  transition:transform var(--dur,170ms) cubic-bezier(.22,.8,.25,1),opacity .35s ease}
.face{position:absolute;inset:var(--gap,2px);border-radius:var(--rad,4px);background-image:var(--img);background-repeat:no-repeat;
  transition:inset .7s ease,border-radius .7s ease,background-position .7s ease,box-shadow .7s ease;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.board.won .face{box-shadow:none}
.tile.hole{opacity:0;pointer-events:none}
.tile.hole .face{transform:scale(.85);transition:transform .5s ease}
.tile.hole.arrive{opacity:1}
.tile.hole.arrive .face{animation:arrive .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes arrive{0%{transform:scale(1.9) rotate(-8deg);opacity:0;filter:brightness(1.8)}60%{opacity:1}100%{transform:none;filter:none}}

.ref{position:absolute;inset:0;background:var(--img) center/100% 100% no-repeat;opacity:0;transition:opacity .25s;pointer-events:none;z-index:5}
.board.peek .ref{opacity:1}

.board::after{content:"";position:absolute;inset:-10%;pointer-events:none;z-index:6;opacity:0;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 48%,rgba(255,255,255,.1) 55%,transparent 65%);transform:translateX(-120%)}
.board.shine::after{animation:shine 1.3s ease-in-out forwards}
@keyframes shine{0%{opacity:1;transform:translateX(-120%)}100%{opacity:1;transform:translateX(120%)}}
.board.pulse{animation:pulse 1.1s ease}
@keyframes pulse{0%{transform:scale(1)}35%{transform:scale(1.03)}100%{transform:scale(1)}}

.win{position:absolute;inset:0;display:grid;place-items:end center;padding-bottom:4%;pointer-events:none;z-index:10}
.win-card{pointer-events:auto;text-align:center;padding:18px 28px 22px;border-radius:18px;max-width:calc(100% - 8px);
  background:color-mix(in srgb,var(--panel) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--line);box-shadow:0 24px 60px -20px rgba(0,0,0,.55);animation:rise .6s cubic-bezier(.2,1.2,.4,1) both}
@keyframes rise{from{transform:translateY(40px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.win-title{font:800 clamp(46px,8vw,104px)/1 var(--display);letter-spacing:-.02em;color:var(--accent);display:flex;justify-content:center;flex-wrap:wrap}
.win-title span{display:inline-block;animation:drop .9s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i)*70ms + .15s)}
@keyframes drop{0%{transform:translateY(-1.2em) rotate(calc(var(--r)*1deg)) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.win-stats{display:flex;justify-content:center;gap:28px;margin:12px 0 14px;font-variant-numeric:tabular-nums}
.record{margin:0 0 14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.record p{margin:0;font:800 20px/1.2 var(--display);color:var(--ink)}
.record form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.name-in{font:700 20px/1 var(--ui);min-height:48px;width:min(260px,60vw);padding:0 14px;border-radius:12px;
  border:2px solid var(--accent);background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
.saved{font-weight:700;color:var(--leaf)}
.win-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@media (max-width:900px){
  .main{flex-direction:column}
  .scores{flex:none;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 12px;gap:6px 14px}
  .scores h2{font-size:16px}
  .lvl:not(.cur),.reset{display:none}
  .lvl{border-top:0;padding-top:0;flex-direction:row;flex-wrap:wrap;gap:4px 10px}
  .lvl-h::after{display:none}
}
@media (max-width:640px){.logo{height:34px}.stats{gap:12px}.stat b{font-size:18px}.sizes button{min-width:40px;padding:0 6px;font-size:14px}}
@media (prefers-reduced-motion:reduce){
  .tile,.face{transition-duration:.01ms!important}
  .board.shine::after,.board.pulse,.win-title span,.win-card,.tile.hole.arrive .face,.row.fresh{animation:none!important}
}
</style>
</head>
<body>


<div class="app">
  <header>
    <h1 id="title">Mr Oehm's <span class="cjd">CJD</span> Puzzle</h1>
    <div class="controls">
      <div class="sizes" id="sizes" role="group" aria-label="Level"></div>
      <div class="stats">
        <div class="stat"><span>Züge</span><b id="moves">0</b></div>
        <div class="stat"><span>Zeit</span><b id="time">0:00</b></div>
      </div>

<canvas id="fx"></canvas>

<script>
(()=>{
const IMG_W=1600, IMG_H=1068;
const LEVELS=[[3,2],[3,3],[4,3],[4,4],[5,5],[6,6]];   // [Spalten, Zeilen]
const $=id=>document.getElementById(id);
const board=$('board'), stage=$('stage');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const label=l=>LEVELS[l][0]+'×'+LEVELS[l][1];
const key=l=>LEVELS[l][0]+'x'+LEVELS[l][1];

let L=3, C=4, R=4, B=16, BL=15, cells=[], pos=[], tiles=[];
let tw=0, th=0, gap=2, moves=0, t0=0, timer=null, busy=true, done=false, round=0, cheated=false, lastTime=0;

const store={get(k,d){try{const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
{const s=store.get('cjdPuzzleLevel',null); const i=LEVELS.findIndex((_,i)=>key(i)===s); if(i>=0) L=i;}
let scores=store.get('cjdPuzzleScores',{});

// level chips
LEVELS.forEach((_,i)=>{
  const b=document.createElement('button'); b.type='button'; b.textContent=label(i); b.dataset.l=i;
  b.addEventListener('click',()=>newRound(i)); $('sizes').appendChild(b);
});
function markLevel(){[...$('sizes').children].forEach(b=>b.setAttribute('aria-pressed',+b.dataset.l===L));}

// ---------- leaderboard ----------
const fmt=ms=>{const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const fmtT=ms=>{const s=Math.floor(ms/100)/10; const m=Math.floor(s/60); return m+':'+(s-m*60).toFixed(1).padStart(4,'0').replace('.',',');};
function listFor(l){return (scores[key(l)]||[]).slice().sort((a,b)=>a.t-b.t||a.m-b.m).slice(0,3);}
function renderScores(fresh){
  const box=$('levels'); box.innerHTML='';
  LEVELS.forEach((_,l)=>{
    const g=document.createElement('div'); g.className='lvl'+(l===L?' cur':'');
    const h=document.createElement('div'); h.className='lvl-h'; h.textContent=label(l); g.appendChild(h);
    const list=listFor(l);
    for(let i=0;i<3;i++){
      const e=list[i], r=document.createElement('div'); r.className='row'+(e?'':' empty')+(e&&e===fresh?' fresh':'');
      const rk=document.createElement('span'); rk.className='rk'; rk.textContent=i+1;
      const nm=document.createElement('span'); nm.className='nm'; nm.textContent=e?e.n:'–';
      const tm=document.createElement('span'); tm.className='tm'; tm.textContent=e?fmtT(e.t):'';
      r.append(rk,nm,tm); g.appendChild(r);
    }
    box.appendChild(g);
  });
}
function rankFor(t){const list=listFor(L); let i=0; while(i<list.length && list[i].t<=t) i++; return i<3?i+1:0;}

// hold the "Bestenliste" heading ~2 s to clear the list
let resetT=null; const sh=$('scoresTitle');
sh.addEventListener('pointerdown',()=>{clearTimeout(resetT); resetT=setTimeout(()=>{$('resetBox').hidden=false;},2000);});
['pointerup','pointerleave','pointercancel'].forEach(ev=>sh.addEventListener(ev,()=>clearTimeout(resetT)));
sh.addEventListener('contextmenu',e=>e.preventDefault());
$('resetYes').addEventListener('click',()=>{scores={}; store.set('cjdPuzzleScores',scores); renderScores(); $('resetBox').hidden=true;});
$('resetNo').addEventListener('click',()=>{$('resetBox').hidden=true;});

// ---------- layout ----------
function fit(){
  const s=stage.getBoundingClientRect(); if(!s.width||!s.height) return;
  const ratio=IMG_W/IMG_H;
  let w=s.width, h=w/ratio; if(h>s.height){h=s.height; w=h*ratio;}
  tw=Math.floor(w/C); th=Math.floor(h/R);
  board.style.width=tw*C+'px'; board.style.height=th*R+'px';
  tiles.forEach(t=>{t.style.width=tw+'px'; t.style.height=th+'px';});
  layoutFaces();
}
function layoutFaces(){
  const g=done?0:gap, W=tw*C, H=th*R;
  board.style.setProperty('--gap',g+'px');
  board.style.setProperty('--rad',(done?0:Math.max(2,Math.min(6,Math.min(tw,th)*.03)))+'px');
  tiles.forEach((t,id)=>{
    const r=(id/C)|0, c=id%C, f=t.firstChild;
    f.style.backgroundSize=W+'px '+H+'px';
    f.style.backgroundPosition=(-(c*tw+g))+'px '+(-(r*th+g))+'px';
  });
}
function place(id){const cell=pos[id]; tiles[id].style.transform=`translate(${(cell%C)*100}%,${((cell/C)|0)*100}%)`;}
new ResizeObserver(fit).observe(stage);

// ---------- game ----------
function build(){
  tiles.forEach(t=>t.remove()); tiles=[];
  for(let id=0;id<B;id++){
    const t=document.createElement('div'); t.className='tile'; t.appendChild(document.createElement('div')).className='face';
    t.addEventListener('pointerdown',e=>{e.preventDefault(); tap(pos[id]);});
    board.appendChild(t); tiles.push(t);
  }
}
function shuffled(){
  let a;
  do{
    a=[...Array(B-1).keys()];
    for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]];}
    let inv=0; for(let i=0;i<a.length;i++) for(let j=i+1;j<a.length;j++) if(a[i]>a[j]) inv++;
    if(inv%2) [a[0],a[1]]=[a[1],a[0]];
  }while(a.every((v,i)=>v===i));
  a.push(BL); return a;
}
async function newRound(l){
  const my=++round;
  if(l!=null) L=l; [C,R]=LEVELS[L]; B=C*R; BL=B-1; done=false; busy=true; cheated=false;
  store.set('cjdPuzzleLevel',key(L));
  markLevel(); renderScores(); hideWin(); stopTimer(); t0=0; moves=0; showStats();
  board.classList.remove('won','shine','pulse');
  gap=B<=16?3:2;
  build();
  cells=[...Array(B).keys()]; pos=[...cells];
  board.style.setProperty('--dur','0ms');
  fit(); tiles.forEach((_,i)=>place(i));
  await sleep(reduced?50:450); if(my!==round) return;
  tiles[BL].classList.add('hole');
  await sleep(reduced?50:450); if(my!==round) return;
  cells=shuffled(); cells.forEach((id,c)=>pos[id]=c);
  board.style.setProperty('--dur',reduced?'0ms':'750ms');
  tiles.forEach((t,i)=>{t.style.transitionDelay=reduced?'0ms':(Math.random()*350|0)+'ms'; place(i);});
  await sleep(reduced?50:1150); if(my!==round) return;
  tiles.forEach(t=>t.style.transitionDelay='');
  board.style.setProperty('--dur','170ms');
  busy=false;
}

function swapInto(cell){ // tile at cell slides into the hole
  const h=pos[BL], id=cells[cell];
  cells[h]=id; pos[id]=h; cells[cell]=BL; pos[BL]=cell;
  place(id); place(BL); moves++;
}
function tap(cell){
  if(busy||done) return;
  const h=pos[BL], hr=(h/C)|0, hc=h%C, r=(cell/C)|0, c=cell%C;
  if(cell===h || (r!==hr && c!==hc)) return;
  const step = r===hr ? (c>hc?1:-1) : (r>hr?C:-C);
  if(!t0) startTimer();
  for(let k=h+step;;k+=step){ swapInto(k); if(k===cell) break; }
  showStats(); check();
}
function check(){ if(cells.every((v,i)=>v===i)) win(); }

// ---------- timer ----------
function startTimer(){t0=performance.now(); timer=setInterval(showStats,250);}
function stopTimer(){clearInterval(timer); timer=null;}
function elapsed(){return t0?performance.now()-t0:0;}
function showStats(){$('moves').textContent=moves; $('time').textContent=fmt(elapsed());}

// ---------- solver (used by the hidden helper) ----------
function solve(start){
  const bd=start.slice(), p=[]; bd.forEach((t,i)=>p[t]=i);
  const locked=new Uint8Array(B), nb=[];
  for(let i=0;i<B;i++){const r=(i/C)|0,c=i%C,a=[]; if(r>0)a.push(i-C); if(r<R-1)a.push(i+C); if(c>0)a.push(i-1); if(c<C-1)a.push(i+1); nb.push(a);}
  const out=[], apply=cell=>{const h=p[BL],t=bd[cell]; bd[h]=t; p[t]=h; bd[cell]=BL; p[BL]=cell; out.push(cell);};
  function bfs(tr){ // bring tracked tiles home; untracked, unlocked tiles may be displaced freely
    const k=tr.length, enc=s=>{let v=0; for(const x of s) v=v*B+x; return v;};
    const dec=v=>{const s=new Array(k+1); for(let i=k;i>=0;i--){s[i]=v%B; v=Math.floor(v/B);} return s;};
    const goal=s=>{for(let i=0;i<k;i++) if(s[i+1]!==tr[i]) return false; return true;};
    const s0=[p[BL],...tr.map(t=>p[t])]; if(goal(s0)) return;
    const size=Math.pow(B,k+1), arr=size<=300000;
    const prev=arr?new Int32Array(size).fill(-2):new Map();
    const get=arr?x=>prev[x]:x=>prev.has(x)?prev.get(x):-2, set=arr?(x,v)=>{prev[x]=v}:(x,v)=>prev.set(x,v);
    const k0=enc(s0); set(k0,-1);
    const q=[k0]; let qi=0, end=-1;
    outer: while(qi<q.length){
      const kk=q[qi++], s=dec(kk), h=s[0];
      for(const nc of nb[h]){
        if(locked[nc]) continue;
        const ns=s.slice(); ns[0]=nc; for(let i=1;i<=k;i++) if(s[i]===nc) ns[i]=h;
        const nk=enc(ns); if(get(nk)!==-2) continue; set(nk,kk);
        if(goal(ns)){end=nk; break outer;}
        q.push(nk);
      }
    }
    if(end<0) throw new Error('kein Weg');
    const path=[]; for(let c=end;c!==k0;c=get(c)) path.push(dec(c)[0]);
    path.reverse().forEach(apply);
  }
  for(let r=0;r<R-2;r++){
    for(let c=0;c<C-2;c++){const t=r*C+c; bfs([t]); locked[t]=1;}
    const a=r*C+C-2; bfs([a,a+1]); locked[a]=locked[a+1]=1;
  }
  for(let c=0;c<C-2;c++){const a=(R-2)*C+c; bfs([a,a+C]); locked[a]=locked[a+C]=1;}
  const q=(R-2)*C+C-2; bfs([q,q+1,q+C]);
  return out;
}
async function autoSolve(){
  if(busy||done) return;
  busy=true; cheated=true; const my=round;
  let path; try{path=solve(cells);}catch(e){busy=false; return;}
  if(!t0) startTimer();
  const per=Math.min(170,7000/Math.max(1,path.length));        // whole run takes ~7 s at most
  const batch=Math.max(1,Math.round(16/per)), wait=Math.max(16,per);
  board.style.setProperty('--dur',Math.round(Math.max(per,16)*1.1)+'ms');
  for(let i=0;i<path.length;i+=batch){
    if(my!==round) return;
    for(let j=i;j<Math.min(i+batch,path.length);j++) swapInto(path[j]);
    showStats(); await sleep(wait);
  }
  board.style.setProperty('--dur','170ms');
  busy=false; check();
}

// hidden helper: hold the title ~1 s, or Shift+L
let holdT=null;
const title=$('title');
title.addEventListener('pointerdown',()=>{clearTimeout(holdT); holdT=setTimeout(autoSolve,1000);});
['pointerup','pointerleave','pointercancel'].forEach(ev=>title.addEventListener(ev,()=>clearTimeout(holdT)));
title.addEventListener('contextmenu',e=>e.preventDefault());

// keyboard: arrows slide a tile into the hole
addEventListener('keydown',e=>{
  if(e.target.closest && e.target.closest('input,textarea')) return;
  if(e.shiftKey && (e.key==='L'||e.key==='l')){autoSolve(); return;}
  const h=pos[BL], r=(h/C)|0, c=h%C;
  const m={ArrowLeft:c<C-1?h+1:-1,ArrowRight:c>0?h-1:-1,ArrowUp:r<R-1?h+C:-1,ArrowDown:r>0?h-C:-1}[e.key];
  if(m!==undefined){e.preventDefault(); if(m>=0) tap(m);}
});

// reference image while held
const peek=$('peek');
const peekOn=()=>board.classList.add('peek'), peekOff=()=>board.classList.remove('peek');
peek.addEventListener('pointerdown',peekOn);
['pointerup','pointerleave','pointercancel'].forEach(ev=>peek.addEventListener(ev,peekOff));
peek.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault(); peekOn();}});
peek.addEventListener('keyup',peekOff);

$('newRound').addEventListener('click',()=>newRound());
$('again').addEventListener('click',()=>newRound());
$('harder').addEventListener('click',()=>newRound(Math.min(LEVELS.length-1,L+1)));

// name entry
$('nameForm').addEventListener('submit',e=>{
  e.preventDefault();
  const n=$('nameIn').value.trim().replace(/\s+/g,' ').slice(0,16); if(!n){$('nameIn').focus(); return;}
  const entry={n,t:Math.round(lastTime),m:moves,d:new Date().toISOString().slice(0,10)};
  const k=key(L); scores[k]=[...(scores[k]||[]),entry].sort((a,b)=>a.t-b.t||a.m-b.m).slice(0,3);
  store.set('cjdPuzzleScores',scores);
  $('nameForm').hidden=true; $('saved').hidden=false; $('nameIn').blur();
  renderScores(entry);
});

// ---------- win sequence ----------
'Geschafft!'.split('').forEach((ch,i)=>{const s=document.createElement('span'); s.textContent=ch; s.setAttribute('aria-hidden','true');
  s.style.setProperty('--i',i); s.style.setProperty('--r',(Math.random()*60-30)|0); $('winTitle').appendChild(s);});
function hideWin(){$('win').hidden=true;}
async function win(){
  done=true; busy=true; stopTimer(); showStats(); const my=round;
  lastTime=elapsed();
  await sleep(250); if(my!==round) return;
  board.classList.add('won'); layoutFaces();            // seams close
  await sleep(reduced?0:650); if(my!==round) return;
  tiles[BL].classList.add('arrive');                    // last piece drops in
  await sleep(reduced?0:750); if(my!==round) return;
  board.classList.add('shine','pulse');
  if(!reduced) celebrate();
  await sleep(reduced?0:700); if(my!==round) return;
  $('wMoves').textContent=moves; $('wTime').textContent=fmtT(lastTime); $('wSize').textContent=label(L);
  const last=L>=LEVELS.length-1; $('harder').hidden=last; if(!last) $('harder').textContent='Nächstes Level · '+label(L+1);
  const rank=cheated?0:rankFor(Math.round(lastTime));
  $('record').hidden=!rank; $('nameForm').hidden=false; $('saved').hidden=true; $('nameIn').value='';
  if(rank) $('recordText').textContent=`Platz ${rank} in der Bestenliste für ${label(L)}!`;
  const w=$('win'); w.hidden=false;
  w.querySelectorAll('.win-title span,.win-card').forEach(el=>{el.style.animation='none'; el.offsetWidth; el.style.animation='';});
  if(rank) setTimeout(()=>{ if(my===round) $('nameIn').focus({preventScroll:true}); },900);
}

// ---------- confetti + fireworks ----------
const cv=$('fx'), cx=cv.getContext('2d');
const COLORS=['#ea7440','#d25d27','#f6c344','#4f8a3c','#7fb36a','#006c99','#6cb8de','#ffffff'];
let parts=[], rockets=[], running=false, spawnUntil=0, nextRocket=0;
function size(){const d=devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; cx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',size); size();
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0];
function cannon(x,y,ang,n){
  for(let i=0;i<n;i++){const a=ang+rnd(-.35,.35), v=rnd(9,19)*(innerHeight/900+.4);
    parts.push({k:'c',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:rnd(6,12),h:rnd(4,8),rot:rnd(0,6.3),vr:rnd(-.3,.3),wob:rnd(0,6.3),col:pick(COLORS)});}
}
function rocket(){rockets.push({x:rnd(.15,.85)*innerWidth,y:innerHeight+10,vx:rnd(-1.5,1.5),vy:-rnd(13,17)*(innerHeight/900+.3),col:pick(COLORS)});}
function explode(r){
  const n=70, col2=pick(COLORS);
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2, v=rnd(2,6.5);
    parts.push({k:'s',x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,col:Math.random()<.5?r.col:col2,life:1,decay:rnd(.012,.02)});}
}
function celebrate(){
  const now=performance.now(); spawnUntil=now+3200; nextRocket=now+200;
  cannon(0,innerHeight,-Math.PI/3,160); cannon(innerWidth,innerHeight,-2*Math.PI/3,160);
  setTimeout(()=>{cannon(innerWidth/2,innerHeight,-Math.PI/2,120);},450);
  if(!running){running=true; requestAnimationFrame(loop);}
}
function loop(now){
  cx.clearRect(0,0,innerWidth,innerHeight);
  if(now<spawnUntil && now>nextRocket){rocket(); nextRocket=now+rnd(260,480);}
  rockets=rockets.filter(r=>{
    r.x+=r.vx; r.y+=r.vy; r.vy+=.25;
    cx.fillStyle=r.col; cx.beginPath(); cx.arc(r.x,r.y,3,0,7); cx.fill();
    cx.fillStyle='rgba(255,220,160,.5)'; cx.fillRect(r.x-1,r.y+3,2,10);
    if(r.vy>=-1.5){explode(r); return false;} return true;
  });
  parts=parts.filter(p=>{
    if(p.k==='c'){
      p.vx*=.985; p.vy=p.vy*.985+.32; p.wob+=.12; p.x+=p.vx+Math.sin(p.wob)*.8; p.y+=p.vy; p.rot+=p.vr;
      if(p.y>innerHeight+30) return false;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.scale(1,Math.cos(p.wob));
      cx.fillStyle=p.col; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
    }else{
      p.vx*=.97; p.vy=p.vy*.97+.06; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
      if(p.life<=0) return false;
      cx.globalAlpha=p.life; cx.fillStyle=p.col; cx.beginPath(); cx.arc(p.x,p.y,2.2,0,7); cx.fill(); cx.globalAlpha=1;
    }
    return true;
  });
  if(parts.length||rockets.length||now<spawnUntil) requestAnimationFrame(loop);
  else{running=false; cx.clearRect(0,0,innerWidth,innerHeight);}
}

newRound();
})();
</script>
