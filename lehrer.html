<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vokabeltests – Lehrer · OEM</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1c2230;--mut:#687086;--acc:#2456d6;--ok:#1e8e3e;--half:#d98a00;--bad:#d93025;--line:#e2e6ed}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
button:hover{filter:brightness(.96)}
button.green{background:var(--ok);border-color:var(--ok);color:#fff}
button.red{background:var(--bad);border-color:var(--bad);color:#fff}
button.ghost{background:transparent}
input,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd5df;border-radius:8px;width:100%;background:#fff;color:var(--ink)}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;resize:vertical}
.mut{color:var(--mut)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border-radius:14px;padding:24px;box-shadow:0 1px 4px #0002;width:100%;max-width:380px}
.card label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}
.card button{width:100%;margin-top:18px}
.err{color:var(--bad);margin-top:10px;min-height:1.2em}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:#fff;box-shadow:0 1px 3px #0002;position:sticky;top:0;z-index:5}
header .sp{flex:1}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:16px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
aside{background:#fff;border-radius:12px;padding:10px}
aside>button{width:100%;margin-bottom:8px}
.ti{padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.ti:hover{background:#f4f6fa}
.ti.on{background:#e8eefc;border-color:#c6d4f6}
.ti .tt{font-weight:600}
.ti .mut{font-size:13px}
#pane{background:#fff;border-radius:12px;padding:18px;min-width:0}
h2{margin:0 0 4px;font-size:22px}
h3{margin:22px 0 8px}
.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.codebox{font:700 34px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;padding:10px 16px;border-radius:10px;background:#e8eefc;color:var(--acc);cursor:pointer}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.b0{background:#e3e7ee;color:#4b5263}.b1{background:#dff3e4;color:var(--ok)}.b2{background:#fde7e5;color:var(--bad)}
.tabs{display:flex;gap:4px;margin:18px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px}
.tabs button.on{border-bottom-color:var(--acc);color:var(--acc);font-weight:600}
.ed label{display:block;color:var(--mut);font-size:13px;margin:12px 0 4px}
.ed label.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px}
.ed label.chk input{width:auto}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.g3 label{margin-top:0}
code{background:#f1f3f7;padding:1px 5px;border-radius:4px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.bar .sp{flex:1}
.tw{overflow-x:auto}
table.res{border-collapse:collapse;width:100%}
.res th,.res td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.res th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600}
#rb tr{cursor:pointer}
#rb tr:hover{background:#f6f8fb}
#rb tr.sel{background:#e8eefc}
.st{font-size:13px;padding:2px 8px;border-radius:99px}
.st.ok{background:#dff3e4;color:var(--ok)}.st.run{background:#e8eefc;color:var(--acc)}.st.bad{background:#fde7e5;color:var(--bad)}
.warn{color:var(--bad);font-weight:600}
#det{margin-top:8px}
.dh{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dh h3{margin:16px 0 8px;flex:1}
td.ans{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
button.g{min-width:46px;font-weight:700;font-size:16px;padding:4px 10px;color:#fff;border:0}
.g0{background:var(--ok)}.g1{background:var(--half)}.g2{background:var(--bad)}
button.g.man{box-shadow:0 0 0 3px #1c223066}
.barq{display:inline-block;width:110px;height:9px;background:#eef1f5;border-radius:9px;vertical-align:middle;margin-right:6px;overflow:hidden}
.barq i{display:block;height:100%;background:var(--bad)}
#ov{position:fixed;inset:0;background:#fff;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.ovt{font-size:36px;font-weight:700}
.ovc{font:800 min(28vw,260px)/1.1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--acc)}
.ovu{font-size:28px;margin-bottom:20px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2230;color:#fff;padding:10px 18px;border-radius:10px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#print{display:none}
@media print{
  body{background:#fff}
  #login,#dash,#ov,#toast{display:none!important}
  #print{display:block;font-size:12pt}
  .pg{page-break-after:always}
  .pg table{border-collapse:collapse;width:100%}
  .pg th,.pg td{border:1px solid #999;padding:4px 6px;text-align:left}
}
</style>
</head>
<body>
<div id="login" class="center"><form class="card" id="lf">
  <h2>Vokabeltests · OEM</h2>
  <label>E-Mail</label><input id="le" type="email" autocomplete="username">
  <label>Passwort</label><input id="lp" type="password" autocomplete="current-password">
  <button class="green" type="submit">Anmelden</button><div class="err" id="lerr"></div>
</form></div>

<div id="dash" hidden>
  <header><b>Vokabeltests · OEM</b><span class="sp"></span><span class="mut" id="who"></span><button id="logout">Abmelden</button></header>
  <div class="wrap">
    <aside><button class="green" id="new">+ Neuer Test</button><div id="tlist"></div></aside>
    <section id="pane"></section>
  </div>
</div>
<div id="ov" hidden></div>
<div id="toast"></div>
<div id="print"></div>

<script>
// ===== Firebase-Konfiguration eintragen (identisch in index.html) =====
const firebaseConfig = {
  apiKey: "AIzaSyBY_6OqGoHDyJB4SaCD_oj4qMW3O-jzNSE",
  authDomain: "vokabeltests.firebaseapp.com",
  databaseURL: "https://vokabeltests-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "vokabeltests",
  storageBucket: "vokabeltests.firebasestorage.app",
  messagingSenderId: "238017724845",
  appId: "1:238017724845:web:b6f660616243bbce202124"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.database(), TS=firebase.database.ServerValue.TIMESTAMP;
let off=0; db.ref('.info/serverTimeOffset').on('value',s=>off=s.val()||0);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const f=x=>String(Math.round(x*2)/2).replace('.',',');
const sym=v=>v===0?'✓':v===.5?'½':'✗';
const dt=ts=>ts?new Date(ts).toLocaleString('de-DE'):'';
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}

// ===== Bewertung =====
// 0 = richtig, 0.5 = halber Fehler (genau 1 Zeichen fehlt/falsch/zu viel), 1 = Fehler. Groß/Klein zählt.
const norm=s=>String(s||'').replace(/[’‘`´]/g,"'").trim().replace(/\s+/g,' ');
function lev(a,b){
  a=Array.from(a); b=Array.from(b);
  if(Math.abs(a.length-b.length)>1) return 2;
  // Damerau-Levenshtein (OSA): Vertauschung zweier Nachbarbuchstaben zählt als 1
  let pp=null, p=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const c=[i];
    for(let j=1;j<=b.length;j++){
      c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
      if(pp&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) c[j]=Math.min(c[j],pp[j-2]+1);
    }
    pp=p; p=c;
  }
  return p[b.length];
}
function score(given,key){
  const g=norm(given); if(!g) return 1;
  let best=1;
  for(const alt of String(key||'').split(';')){
    const a=norm(alt); if(!a) continue;
    const d=lev(g,a); if(d===0) return 0; if(d===1) best=.5;
  }
  return best;
}

// ===== State =====
let tests={}, sel=null, creating=false, tab='res', subs={}, grades={}, keys=[], keysOk=false, edDirty=false, selSub=null, L=[];
function detach(){L.forEach(([r,fn])=>r.off('value',fn));L=[]}
function listen(path,cb){const r=db.ref(path);const fn=r.on('value',s=>cb(s.val()));L.push([r,fn])}
const toArr=v=>Array.isArray(v)?v:v?Object.keys(v).sort((a,b)=>a-b).map(k=>v[k]):[];

// ===== Auth =====
$('lf').onsubmit=e=>{e.preventDefault();$('lerr').textContent='';
  auth.signInWithEmailAndPassword($('le').value.trim(),$('lp').value).catch(er=>$('lerr').textContent='Anmeldung fehlgeschlagen ('+er.code+')')};
$('logout').onclick=()=>auth.signOut();
auth.onAuthStateChanged(u=>{
  $('login').hidden=!!u; $('dash').hidden=!u;
  if(u){
    $('who').textContent=u.email;
    db.ref('vt/tests').on('value',s=>{
      tests=s.val()||{}; renderList();
      if(sel){ if(!tests[sel]){detach();sel=null;renderPane()} else renderHead() }
    });
    renderPane();
  } else { db.ref('vt/tests').off(); detach(); sel=null; creating=false; }
});

// ===== Liste =====
function badge(s){const [t,c]=({draft:['Entwurf','b0'],open:['freigegeben','b1'],closed:['beendet','b2']})[s]||['?','b0'];return `<span class="badge ${c}">${t}</span>`}
function renderList(){
  const ids=Object.keys(tests).sort((a,b)=>(tests[b].createdAt||0)-(tests[a].createdAt||0));
  $('tlist').innerHTML=ids.map(c=>{const t=tests[c];return `<div class="ti ${c===sel?'on':''}" data-c="${c}">
    <div class="tt">${esc(t.title)}</div><div class="mut">${esc(t.cls||'–')} · ${t.createdAt?new Date(t.createdAt).toLocaleDateString('de-DE'):''} · <b>${c}</b> ${badge(t.status)}</div></div>`}).join('')
    ||'<p class="mut">Noch keine Tests.</p>';
}
$('tlist').onclick=e=>{const d=e.target.closest('[data-c]');if(d)select(d.dataset.c)};
$('new').onclick=()=>{detach();sel=null;creating=true;keys=[];edDirty=false;renderList();renderPane()};

function select(code){
  detach(); creating=false; sel=code; selSub=null; subs={}; grades={}; keys=[]; keysOk=false; edDirty=false;
  tab=tests[code]&&tests[code].status==='draft'?'edit':'res';
  renderList(); renderPane();
  const resUpd=()=>{if(tab==='res'){renderRows();renderDetail();renderAna()}};
  listen('vt/subs/'+code,v=>{subs=v||{};resUpd()});
  listen('vt/grades/'+code,v=>{grades=v||{};resUpd()});
  listen('vt/keys/'+code,v=>{keys=toArr(v);keysOk=true;if(tab==='edit'){if(!edDirty)renderBody()}else resUpd()});
}

// ===== Pane =====
function renderPane(){
  const p=$('pane');
  if(creating){p.innerHTML='<h2>Neuer Test</h2>'+editor(null);upd();return}
  if(!sel){p.innerHTML='<p class="mut">Links einen Test wählen oder „+ Neuer Test“.</p>';return}
  p.innerHTML='<div id="ph"></div><div id="pb"></div>'; renderHead(); renderBody();
}
function renderHead(){
  const t=tests[sel], h=$('ph'); if(!h||!t) return;
  const n=(t.prompts||[]).length;
  h.innerHTML=`<div class="top"><div><h2>${esc(t.title)}</h2>
      <div class="mut">${esc(t.cls||'–')} · ${n} Vokabeln · ${f(t.duration/60)} Min. · ${t.shuffle?'Reihenfolge gemischt':'feste Reihenfolge'}</div></div>
      <div class="codebox" data-a="big" title="Groß anzeigen">${sel}</div></div>
    <div class="acts">${badge(t.status)}
      ${t.status==='open'?'<button data-a="close" class="red">Test beenden</button>':`<button data-a="open" class="green">${t.status==='closed'?'Wieder freigeben':'Freigeben'}</button>`}
      <button data-a="big">Code anzeigen</button><button data-a="dup">Duplizieren</button><button data-a="del" class="ghost">Löschen</button></div>
    <div class="tabs"><button data-t="res" class="${tab==='res'?'on':''}">Ergebnisse</button><button data-t="edit" class="${tab==='edit'?'on':''}">Bearbeiten</button></div>`;
}
function renderBody(){
  const pb=$('pb'); if(!pb) return;
  if(tab==='edit'){pb.innerHTML=keysOk?editor(sel):'<p class="mut">Lade …</p>';upd()}
  else{resLayout();renderRows();renderDetail();renderAna()}
}

// ===== Editor =====
function editor(code){
  const t=code?tests[code]:{title:'',cls:'',duration:600,shuffle:true,prompts:[]};
  const txt=(t.prompts||[]).map((p,i)=>`${p} = ${keys[i]??''}`).join('\n');
  return `<div class="ed">
    <div class="g3"><label>Titel<input id="eT" value="${esc(t.title)}" placeholder="Unit 2 – At school"></label>
      <label>Lerngruppe<input id="eC" value="${esc(t.cls||'')}" placeholder="5f"></label>
      <label>Dauer (Min.)<input id="eD" type="number" min="1" max="180" step="0.5" value="${t.duration/60}"></label></div>
    <label class="chk"><input type="checkbox" id="eS" ${t.shuffle?'checked':''}> Reihenfolge für jede Person mischen</label>
    <label>Vokabeln – eine pro Zeile: <code>Deutsch = Englisch</code> · mehrere richtige Lösungen mit <code>;</code> trennen · zwei Spalten aus Excel (Deutsch | Englisch) einfügen geht auch</label>
    <textarea id="eV" rows="16" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="die Schule = school&#10;gehen = to go; go">${esc(txt)}</textarea>
    <div class="acts"><button data-a="save" class="green">Speichern</button><span id="eP" class="mut"></span></div></div>`;
}
function parse(txt){
  const out=[],bad=[];
  txt.split(/\r?\n/).forEach((l,i)=>{
    if(!l.trim()) return;
    let a,b; const t=l.indexOf('\t'), e=l.indexOf('=');
    if(t>=0){a=l.slice(0,t);b=l.slice(t+1)} else if(e>=0){a=l.slice(0,e);b=l.slice(e+1)} else {bad.push(i+1);return}
    a=a.trim(); b=b.replace(/\t/g,' ').trim();
    if(!a||!b){bad.push(i+1);return}
    out.push([a,b]);
  });
  return {out,bad};
}
function upd(){const v=$('eV');if(!v)return;const r=parse(v.value),u=untypeable(r.out);
  $('eP').textContent=`${r.out.length} Vokabeln erkannt`+(r.bad.length?` · Zeile ${r.bad.join(', ')} ohne „=“`:'')+(u.length?` · ⚠ Vokabel ${u.join(', ')}: englische Lösung enthält Zeichen, die die Schülertastatur nicht hat`:'')}
// Zeichen, die die Schüler-Tastatur (englisch, ohne Umlaute) tippen kann
const TYPEABLE=/^[A-Za-z0-9 \-',.?!()\/;]*$/;
const untypeable=out=>out.map((x,i)=>TYPEABLE.test(x[1])?0:i+1).filter(Boolean);
async function newCode(){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for(;;){let c='';for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];
    if(!(await db.ref('vt/tests/'+c).get()).exists()) return c;}
}
async function saveTest(code){
  const title=$('eT').value.trim(), cls=$('eC').value.trim(), dur=Math.round(parseFloat($('eD').value)*60), shuffle=$('eS').checked;
  const {out,bad}=parse($('eV').value);
  if(!title) return alert('Bitte einen Titel eingeben.');
  if(!(dur>=30)) return alert('Bitte eine gültige Dauer eingeben.');
  if(!out.length) return alert('Keine Vokabeln erkannt.');
  const u=untypeable(out);
  if(u.length&&!confirm(`Vokabel ${u.join(', ')}: Die englische Lösung enthält Zeichen (z. B. Umlaute), die auf der Schülertastatur fehlen. Trotzdem speichern?`)) return;
  if(bad.length&&!confirm(`Zeile(n) ${bad.join(', ')} werden ignoriert (kein „=“). Trotzdem speichern?`)) return;
  const prompts=out.map(x=>x[0]), key=out.map(x=>x[1]);
  try{
    if(code){
      if(!keysOk) return;
      if(Object.keys(subs).length&&!confirm('Es gibt schon Teilnahmen. Änderungen an Anzahl/Reihenfolge der Vokabeln verfälschen die Auswertung. Trotzdem speichern?')) return;
      await db.ref('vt/keys/'+code).set(key);
      await db.ref('vt/tests/'+code).update({title,cls,duration:dur,shuffle,prompts});
      edDirty=false; toast('Gespeichert');
    } else {
      const c=await newCode();
      await db.ref('vt/keys/'+c).set(key);
      await db.ref('vt/tests/'+c).set({title,cls,duration:dur,shuffle,prompts,status:'draft',createdAt:TS});
      select(c); toast('Gespeichert – Code '+c);
    }
  }catch(e){alert('Fehler beim Speichern: '+(e.code||e.message))}
}

// ===== Ergebnisse =====
function resLayout(){
  $('pb').innerHTML=`<div class="bar"><span id="sum" class="mut"></span><span class="sp"></span><button data-a="csv">CSV-Export</button><button data-a="print">Rückgabebögen drucken</button></div>
    <div class="tw"><table class="res"><thead><tr><th>Name</th><th>Status</th><th>Ausgefüllt</th><th>Fehler</th><th>Punkte</th><th title="Wie oft die App/der Tab verlassen wurde">App-Wechsel</th><th>Dauer</th></tr></thead><tbody id="rb"></tbody></table></div>
    <div id="det"></div><h3>Wortanalyse</h3><div class="tw"><table class="res" id="ana"></table></div>`;
}
function evalSub(id){
  const s=subs[id], a=s.answers||[], g=grades[id]||{};
  const items=keys.map((k,i)=>{const ans=a[i]||'', auto=score(ans,k), ov=g[i]==null?null:g[i];return {i,ans,auto,ov,val:ov==null?auto:ov}});
  return {items,err:items.reduce((x,y)=>x+y.val,0),filled:items.filter(x=>norm(x.ans)).length};
}
function stat(s,t){
  const dur=t.duration*1000;
  if(s.status==='submitted'){const used=s.submittedAt-s.startedAt;return {txt:'abgegeben'+(s.auto?' (auto)':''),cls:'ok',dur:fmt(used/1000),late:used>dur+15000}}
  const rem=(s.startedAt||0)+dur-(Date.now()+off);
  return rem>0?{txt:'läuft · '+fmt(rem/1000),cls:'run',dur:'–'}:{txt:'keine Abgabe',cls:'bad',dur:'–'};
}
const sortedIds=(onlyDone)=>Object.keys(subs).filter(id=>!onlyDone||subs[id].status==='submitted')
  .sort((a,b)=>(subs[a].name||'').localeCompare(subs[b].name||'','de',{sensitivity:'base'}));
function renderRows(){
  const rb=$('rb'), t=tests[sel]; if(!rb||!t||!keysOk) return;
  const n=keys.length, ids=sortedIds(false);
  rb.innerHTML=ids.map(id=>{const s=subs[id],e=evalSub(id),st=stat(s,t);
    return `<tr data-s="${id}" class="${id===selSub?'sel':''}"><td><b>${esc(s.name)}</b></td><td><span class="st ${st.cls}">${st.txt}</span></td>
      <td>${e.filled}/${n}</td><td><b>${f(e.err)}</b></td><td>${f(n-e.err)}/${n}</td>
      <td>${s.blur?`<span class="warn">${s.blur}</span>`:'0'}</td><td class="${st.late?'warn':''}" title="${st.late?'Zeitlimit überschritten':''}">${st.dur}</td></tr>`}).join('')
    ||'<tr><td colspan="7" class="mut">Noch keine Teilnahmen.</td></tr>';
  const done=sortedIds(true), running=ids.length-done.length;
  const avg=done.length?done.reduce((x,id)=>x+evalSub(id).err,0)/done.length:0;
  $('sum').textContent=`${done.length} abgegeben · ${running} offen`+(done.length?` · Ø ${avg.toFixed(1).replace('.',',')} Fehler`:'');
}
function renderDetail(){
  const d=$('det'); if(!d) return;
  if(!selSub||!subs[selSub]||!keysOk){d.innerHTML='';return}
  const s=subs[selSub], e=evalSub(selSub), t=tests[sel], n=keys.length;
  d.innerHTML=`<div class="dh"><h3>${esc(s.name)} – ${f(e.err)} Fehler · ${f(n-e.err)}/${n} Punkte</h3>
      <span class="mut">Wertung anklicken: ✓ → ½ → ✗ (Rahmen = manuell)</span><button data-a="delsub" class="ghost">Teilnahme löschen</button><button data-a="closedet" class="ghost">✕</button></div>
    <div class="tw"><table class="res"><thead><tr><th>#</th><th>Deutsch</th><th>Englisch (Lösung)</th><th>Antwort</th><th>Wertung</th></tr></thead><tbody>
    ${e.items.map(x=>`<tr><td>${x.i+1}</td><td>${esc((t.prompts||[])[x.i])}</td><td>${esc(keys[x.i])}</td>
      <td class="ans">${x.ans?esc(x.ans):'<span class="mut">—</span>'}</td>
      <td><button class="g g${x.val*2}${x.ov!=null?' man':''}" data-g="${x.i}">${sym(x.val)}</button></td></tr>`).join('')}
    </tbody></table></div>`;
}
function renderAna(){
  const a=$('ana'); if(!a||!keysOk) return;
  const done=sortedIds(true);
  if(!done.length){a.innerHTML='<tbody><tr><td class="mut">Noch keine Abgaben.</td></tr></tbody>';return}
  const ev=done.map(evalSub), P=tests[sel].prompts||[];
  const rows=keys.map((k,i)=>({i,k,p:P[i],q:ev.reduce((x,e)=>x+e.items[i].val,0)/ev.length})).sort((x,y)=>y.q-x.q);
  a.innerHTML='<thead><tr><th>#</th><th>Deutsch</th><th>Englisch</th><th>Fehlerquote</th></tr></thead><tbody>'+
    rows.map(r=>`<tr><td>${r.i+1}</td><td>${esc(r.p)}</td><td>${esc(r.k)}</td><td><span class="barq"><i style="width:${Math.round(r.q*100)}%"></i></span>${Math.round(r.q*100)} %</td></tr>`).join('')+'</tbody>';
}
function cycle(i){
  const it=evalSub(selSub).items[i], seq=[0,.5,1], nx=seq[(seq.indexOf(it.val)+1)%3];
  db.ref(`vt/grades/${sel}/${selSub}/${i}`).set(nx===it.auto?null:nx);
}
setInterval(()=>{if(sel&&tab==='res'&&$('rb')&&Object.values(subs).some(s=>s.status!=='submitted'))renderRows()},1000);

function csv(){
  const t=tests[sel], n=keys.length, P=t.prompts||[];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const head=['Name','Status','Fehler','Punkte','Max','App-Wechsel','Start','Abgabe'];
  for(let i=0;i<n;i++) head.push(`${i+1}: ${P[i]}`,`${i+1}: Wertung`);
  const rows=[head];
  sortedIds(false).forEach(id=>{const s=subs[id],e=evalSub(id);
    const r=[s.name,s.status==='submitted'?(s.auto?'abgegeben (auto)':'abgegeben'):'offen',f(e.err),f(n-e.err),n,s.blur||0,dt(s.startedAt),dt(s.submittedAt)];
    e.items.forEach(x=>r.push(x.ans,f(x.val))); rows.push(r)});
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`Vokabeltest_${(t.title||sel).replace(/[^\wäöüÄÖÜß-]+/g,'_')}_${sel}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function printAll(){
  const t=tests[sel], P=t.prompts||[], ids=sortedIds(true), n=keys.length;
  if(!ids.length) return alert('Noch keine Abgaben.');
  $('print').innerHTML=ids.map(id=>{const s=subs[id],e=evalSub(id);
    return `<div class="pg"><h2>${esc(t.title)}</h2><p>${esc(s.name)} · ${esc(t.cls||'')} · ${s.submittedAt?new Date(s.submittedAt).toLocaleDateString('de-DE'):''}</p>
      <p><b>${f(e.err)} Fehler</b> – ${f(n-e.err)} von ${n} Punkten</p>
      <table><tr><th>#</th><th>Deutsch</th><th>Deine Antwort</th><th>Englisch (Lösung)</th><th></th></tr>
      ${e.items.map(x=>`<tr><td>${x.i+1}</td><td>${esc(P[x.i])}</td><td>${esc(x.ans)}</td><td>${esc(keys[x.i])}</td><td>${sym(x.val)}</td></tr>`).join('')}</table></div>`}).join('');
  window.print();
}

// ===== Aktionen =====
function showBig(){
  const u=new URL('./',location.href).href;
  $('ov').innerHTML=`<div><div class="ovt">${esc(tests[sel].title)}</div><div class="ovc">${sel}</div><div class="ovu">${esc(u)}</div><div class="mut">Klicken zum Schließen</div></div>`;
  $('ov').hidden=false;
}
$('ov').onclick=()=>$('ov').hidden=true;
async function dup(){
  if(!keysOk) return; const t=tests[sel], c=await newCode();
  await db.ref('vt/keys/'+c).set(keys);
  await db.ref('vt/tests/'+c).set({title:t.title+' (Kopie)',cls:t.cls||'',duration:t.duration,shuffle:!!t.shuffle,prompts:t.prompts,status:'draft',createdAt:TS});
  select(c); toast('Kopie angelegt – Code '+c);
}
async function del(){
  const t=tests[sel];
  if(!confirm(`„${t.title}“ mit allen Teilnahmen endgültig löschen?`)) return;
  const c=sel; detach(); sel=null; renderPane();
  await db.ref().update({['vt/tests/'+c]:null,['vt/keys/'+c]:null,['vt/subs/'+c]:null,['vt/grades/'+c]:null});
  toast('Gelöscht');
}
$('pane').addEventListener('input',e=>{if(e.target.id==='eV'){edDirty=true;upd()}else if(e.target.closest('.ed'))edDirty=true});
$('pane').addEventListener('click',async e=>{
  const b=e.target.closest('[data-a],[data-t],[data-g],[data-s]'); if(!b) return;
  if(b.dataset.t){if(tab==='edit'&&edDirty&&b.dataset.t!=='edit'&&!confirm('Ungespeicherte Änderungen verwerfen?'))return;
    tab=b.dataset.t;edDirty=false;renderHead();renderBody();return}
  if(b.dataset.g!=null){cycle(+b.dataset.g);return}
  if(b.dataset.s){selSub=b.dataset.s;renderRows();renderDetail();$('det').scrollIntoView({behavior:'smooth',block:'start'});return}
  const r=sel&&db.ref('vt/tests/'+sel);
  switch(b.dataset.a){
    case 'open': r.update({status:'open',closedAt:null}); break;
    case 'close': if(confirm('Test beenden? Alle laufenden Tests werden sofort abgegeben.')) r.update({status:'closed',closedAt:TS}); break;
    case 'big': showBig(); break;
    case 'dup': dup(); break;
    case 'del': del(); break;
    case 'save': saveTest(sel); break;
    case 'csv': csv(); break;
    case 'print': printAll(); break;
    case 'closedet': selSub=null; renderRows(); renderDetail(); break;
    case 'delsub':
      if(confirm(`Teilnahme von „${subs[selSub].name}“ löschen?`)){
        const id=selSub; selSub=null;
        await db.ref().update({[`vt/subs/${sel}/${id}`]:null,[`vt/grades/${sel}/${id}`]:null});
      } break;
  }
});
</script>
</body>
</html>
