<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1c2230;--mut:#687086;--acc:#2456d6;--ok:#1e8e3e;--half:#d98a00;--bad:#d93025;--line:#e2e6ed}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
button:hover{filter:brightness(.96)}
button.green{background:var(--ok);border-color:var(--ok);color:#fff}
button.red{background:var(--bad);border-color:var(--bad);color:#fff}
button.ghost{background:transparent}
input,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd5df;border-radius:8px;width:100%;background:#fff;color:var(--ink)}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;resize:vertical}
.mut{color:var(--mut)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border-radius:14px;padding:24px;box-shadow:0 1px 4px #0002;width:100%;max-width:380px}
.card label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}
.card button{width:100%;margin-top:18px}
.err{color:var(--bad);margin-top:10px;min-height:1.2em}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:#fff;box-shadow:0 1px 3px #0002;position:sticky;top:0;z-index:5}
header .sp{flex:1}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:16px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
aside{background:#fff;border-radius:12px;padding:10px}
aside>button{width:100%;margin-bottom:8px}
.ti{padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.ti:hover{background:#f4f6fa}
.ti.on{background:#e8eefc;border-color:#c6d4f6}
.ti .tt{font-weight:600}
.ti .mut{font-size:13px}
#pane{background:#fff;border-radius:12px;padding:18px;min-width:0}
h2{margin:0 0 4px;font-size:22px}
h3{margin:22px 0 8px}
.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.codebox{font:700 34px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;padding:10px 16px;border-radius:10px;background:#e8eefc;color:var(--acc);cursor:pointer}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.b0{background:#e3e7ee;color:#4b5263}.b1{background:#dff3e4;color:var(--ok)}.b2{background:#fde7e5;color:var(--bad)}
.tabs{display:flex;gap:4px;margin:18px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px}
.tabs button.on{border-bottom-color:var(--acc);color:var(--acc);font-weight:600}
.ed label{display:block;color:var(--mut);font-size:13px;margin:12px 0 4px}
.ed label.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px}
.ed label.chk input{width:auto}
.ed select{font:inherit;padding:7px 10px;border:1px solid #cfd5df;border-radius:8px;background:#fff;margin-left:8px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px}
@media (max-width:700px){.g3{grid-template-columns:1fr 1fr}}
header .logo{height:30px;width:auto}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;margin-bottom:8px}
.brand .logo{height:56px;width:auto;max-width:90%}
.brand h2{margin-top:6px}
.ovl .logo{height:70px;width:auto;margin-bottom:10px}
.pgh{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:10px}
.pgh .logo{height:42px;width:auto}
.pgh .r{text-align:right;font-size:10pt}
.g3 label{margin-top:0}
code{background:#f1f3f7;padding:1px 5px;border-radius:4px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.bar .sp{flex:1}
.tw{overflow-x:auto}
table.res{border-collapse:collapse;width:100%}
.res th,.res td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.res th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600}
#rb tr{cursor:pointer}
#rb tr:hover{background:#f6f8fb}
#rb tr.sel{background:#e8eefc}
.st{font-size:13px;padding:2px 8px;border-radius:99px}
.st.ok{background:#dff3e4;color:var(--ok)}.st.run{background:#e8eefc;color:var(--acc)}.st.bad{background:#fde7e5;color:var(--bad)}
.warn{color:var(--bad);font-weight:600}
.cred{margin:12px 0;padding:12px 14px;border-radius:10px;background:#dff3e4;line-height:1.6}
label.ed{display:block;color:var(--mut);font-size:13px}
label.ed input{margin-top:4px}
.pin{padding:4px 10px;border-radius:8px;background:#fff4e0;color:#8a5a00;font-size:14px}
.pin b{font:700 17px ui-monospace,Menlo,monospace;letter-spacing:.1em;margin-left:4px}
#det{margin-top:8px}
.dh{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dh h3{margin:16px 0 8px;flex:1}
td.ans{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
button.g{min-width:46px;font-weight:700;font-size:16px;padding:4px 10px;color:#fff;border:0}
.g0{background:var(--ok)}.g1{background:var(--half)}.g2{background:var(--bad)}
button.g.man{box-shadow:0 0 0 3px #1c223066}
.barq{display:inline-block;width:110px;height:9px;background:#eef1f5;border-radius:9px;vertical-align:middle;margin-right:6px;overflow:hidden}
.barq i{display:block;height:100%;background:var(--bad)}
#ov{position:fixed;inset:0;background:#fff;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.ovt{font-size:36px;font-weight:700}
.ovc{font:800 min(20vw,30vh,240px)/1.1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--acc)}
.ovu{font-size:26px;margin-bottom:20px;word-break:break-all}
.ovrow{display:flex;align-items:center;justify-content:center;gap:5vw;flex-wrap:wrap;margin:10px 0}
.ovqr svg{width:min(34vw,42vh);height:auto;display:block}
.ovqr .mut{font-size:18px;margin-top:6px}

<script>
// ===== Firebase-Konfiguration eintragen (identisch in index.html) =====

// ===== Schullogo: lokal (logo.svg im Repo), sonst von der Schulwebsite =====

// ===== Bewertung =====
// 0 = richtig, 0.5 = halber Fehler (genau 1 Zeichen fehlt/falsch/zu viel), 1 = Fehler. Groß/Klein zählt.
const norm=s=>String(s||'').replace(/[’‘`´]/g,"'").trim().replace(/\s+/g,' ');
function lev(a,b){
  a=Array.from(a); b=Array.from(b);
  if(Math.abs(a.length-b.length)>1) return 2;
  // Damerau-Levenshtein (OSA): Vertauschung zweier Nachbarbuchstaben zählt als 1
  let pp=null, p=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const c=[i];
    for(let j=1;j<=b.length;j++){
      c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
      if(pp&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) c[j]=Math.min(c[j],pp[j-2]+1);
    }
    pp=p; p=c;
  }
  return p[b.length];
}
function score(given,key){
  const g=norm(given); if(!g) return 1;
  let best=1;
  for(const alt of String(key||'').split(';')){
    const a=norm(alt); if(!a) continue;
    const d=lev(g,a); if(d===0) return 0; if(d===1) best=.5;
  }
  return best;
}

// ===== State =====
let testsQ=null, me=null, users={}, teachers={}, approved=false, teamView=false, newCred=null, isAdmin=false, showAll=false, tests={}, sel=null, creating=false, tab='res', subs={}, grades={}, accept={}, keys=[], keysOk=false, pin=null, edDirty=false, selSub=null, L=[];
function detach(){L.forEach(([r,fn])=>r.off('value',fn));L=[]}
function listen(path,cb){const r=db.ref(path);const fn=r.on('value',s=>cb(s.val()));L.push([r,fn])}
const toArr=v=>Array.isArray(v)?v:v?Object.keys(v).sort((a,b)=>a-b).map(k=>v[k]):[];

// ===== Auth =====
$('lf').onsubmit=e=>{e.preventDefault();$('lerr').textContent='';
  auth.signInWithEmailAndPassword($('le').value.trim(),$('lp').value).catch(er=>$('lerr').textContent='Anmeldung fehlgeschlagen ('+er.code+')')};
$('logout').onclick=()=>auth.signOut();
auth.onAuthStateChanged(u=>{
  $('login').hidden=!!u; $('dash').hidden=!u;
  if(u){
    me=u; $('who').textContent=u.email; $('who').title='UID: '+u.uid;
    db.ref('vt/users/'+u.uid).set(u.email||'').catch(()=>{});
    Promise.all([db.ref('vt/admins/'+u.uid).get().then(a=>a.val()===true).catch(()=>false),
                 db.ref('vt/teachers/'+u.uid).get().then(a=>a.val()===true).catch(()=>false)]).then(([ad,ok])=>{
      isAdmin=ad; approved=ok||ad;
      if(isAdmin){
        db.ref('vt/users').on('value',x=>{users=x.val()||{};renderList();renderHead();if(teamView)renderPane()});
        db.ref('vt/teachers').on('value',x=>{teachers=x.val()||{};if(teamView)renderPane()});
      }
      $('scope').hidden=!isAdmin; $('team').hidden=!isAdmin; $('new').hidden=!approved;
      $('who').textContent=u.email+(isAdmin?' (Admin)':'');
      // Testliste: Admin liest alle, Lehrkräfte nur ihre eigenen (Regel erlaubt nur diese Abfrage)
      if(approved){
        testsQ=isAdmin?db.ref('vt/tests'):db.ref('vt/tests').orderByChild('owner').equalTo(u.uid);
        testsQ.on('value',s=>{
          tests=s.val()||{}; claim(); renderList();
          if(sel){ if(!tests[sel]){detach();sel=null;renderPane()} else renderHead() }
        },e=>toast('Tests konnten nicht geladen werden ('+(e.code||e.message)+')'));
      }
      claim(); renderList(); renderPane();
    });
    renderPane();
  } else { if(testsQ){testsQ.off();testsQ=null} tests={}; db.ref('vt/users').off(); db.ref('vt/teachers').off(); users={}; teachers={}; approved=false; teamView=false; $('team').hidden=true; detach(); sel=null; creating=false; me=null; isAdmin=false; showAll=false; $('scope').hidden=true; }
});

// ===== Liste =====
function badge(s){const [t,c]=({draft:['Entwurf','b0'],open:['freigegeben','b1'],closed:['beendet','b2']})[s]||['?','b0'];return `<span class="badge ${c}">${t}</span>`}
// ===== Besitz: jede Lehrkraft sieht nur eigene Tests, Admin optional alle =====
const mine=t=>me&&t.owner===me.uid;
const visible=t=>mine(t)||(isAdmin&&(showAll||!t.owner));
const ownerData=()=>({owner:me.uid});
const ownerName=t=>users[t.owner]||'unbekannt';
// Tests ohne Besitzer (aus der Zeit vor der Umstellung) übernimmt der Admin automatisch
function claim(){
  if(!isAdmin) return;
  const upd={}; Object.keys(tests).forEach(c=>{if(!tests[c].owner){upd[`vt/tests/${c}/owner`]=me.uid}});
  if(Object.keys(upd).length) db.ref().update(upd).catch(()=>{});
}
function renderList(){
  const ids=Object.keys(tests).filter(c=>visible(tests[c])).sort((a,b)=>(tests[b].createdAt||0)-(tests[a].createdAt||0));
  $('tlist').innerHTML=ids.map(c=>{const t=tests[c];return `<div class="ti ${c===sel?'on':''}" data-c="${c}">
    <div class="tt">${esc(t.title)}</div><div class="mut">${esc(t.cls||'–')}${t.teacher?' · '+esc(t.teacher):''} · ${t.createdAt?new Date(t.createdAt).toLocaleDateString('de-DE'):''} · <b>${c}</b> ${badge(t.status)}</div>${!mine(t)?`<div class="mut" style="font-size:12px">von ${esc(ownerName(t))}</div>`:''}</div>`}).join('')
    ||'<p class="mut">Noch keine Tests.</p>';
}
$('scope').onchange=e=>{showAll=e.target.value==='1';if(sel&&!visible(tests[sel])){detach();sel=null;renderPane()}renderList()};
$('tlist').onclick=e=>{const d=e.target.closest('[data-c]');if(d)select(d.dataset.c)};
$('new').onclick=()=>{detach();sel=null;teamView=false;creating=true;keys=[];edDirty=false;renderList();renderPane()};

function select(code){
  detach(); creating=false; teamView=false; sel=code; selSub=null; pin=null; subs={}; grades={}; accept={}; keys=[]; keysOk=false; edDirty=false;

}

// ===== Pane =====
function renderPane(){
  const p=$('pane');
  if(teamView&&isAdmin){p.innerHTML=teamHtml();return}
  if(me&&!approved&&!isAdmin){p.innerHTML=`<h2>Noch nicht freigeschaltet</h2><p class="mut">Dein Zugang muss erst von der Administration freigeschaltet werden. Bitte melde dich danach neu an.</p>
    <p class="mut">Deine Nutzer-UID (für die Administration):<br><code style="font-size:15px;user-select:all">${esc(me.uid)}</code> <button data-a="copyuid">Kopieren</button></p>`;return}

  if(!sel){p.innerHTML='<p class="mut">Links einen Test wählen oder „+ Neuer Test“.</p>';return}
  p.innerHTML='<div id="ph"></div><div id="pb"></div>'; renderHead(); renderBody();
}
function renderHead(){
  const t=tests[sel], h=$('ph'); if(!h||!t) return;
  const n=(t.prompts||[]).length;
  h.innerHTML=`<div class="top"><div><h2>${esc(t.title)}</h2>
      <div class="mut">${esc(t.cls||'–')}${t.teacher?' · Lehrkraft '+esc(t.teacher):''} · ${n} Vokabeln · ${f(t.duration/60)} Min. · ${t.shuffle?'Reihenfolge gemischt':'feste Reihenfolge'}</div>${!mine(t)?`<div class="warn" style="font-size:13px">Test von ${esc(ownerName(t))} – Admin-Ansicht</div>`:''}</div>
      <div class="codebox" data-a="big" title="Groß anzeigen">${sel}</div></div>
    <div class="acts">${badge(t.status)}
      ${t.status==='open'?'<button data-a="close" class="red">Test beenden</button>':`<button data-a="open" class="green">${t.status==='closed'?'Wieder freigeben':'Freigeben'}</button>`}
      ${t.lock!==false?`<span class="pin" title="Für einen weiteren Versuch auf einem Gerät, auf dem der Test schon geschrieben wurde">Geräte-PIN <b>${pin||'…'}</b></span>`:'<span class="mut">mehrere Versuche pro Gerät erlaubt</span>'}
      <button data-a="big">Code anzeigen</button><button data-a="dup">Duplizieren</button><button data-a="del" class="ghost">Löschen</button></div>
    <div class="tabs"><button data-t="res" class="${tab==='res'?'on':''}">Ergebnisse</button><button data-t="edit" class="${tab==='edit'?'on':''}">Bearbeiten</button></div>`;
}
function renderBody(){
  const pb=$('pb'); if(!pb) return;
  if(tab==='edit'){pb.innerHTML=keysOk?editor(sel):'<p class="mut">Lade …</p>';upd()}
  else{resLayout();renderRows();renderDetail();renderAna()}
}

// ===== Editor =====
function editor(code){
  const t=code?tests[code]:{title:'',cls:'',teacher:lastTeacher(),duration:300,qr:lastQr(),shuffle:true,prompts:[],inputOrder:lastOrder()};
  const o=t.inputOrder==='en'?'en':'de';
  const txt=(t.prompts||[]).map((p,i)=>o==='en'?`${keys[i]??''} = ${p}`:`${p} = ${keys[i]??''}`).join('\n');
  return `<div class="ed">
    <div class="g3"><label>Titel<input id="eT" value="${esc(t.title)}" placeholder="Unit 2 – At school"></label>
      <label>Lerngruppe<input id="eC" value="${esc(t.cls||'')}" placeholder="5f"></label>
      <label>Lehrerkürzel <span class="mut">(optional)</span><input id="eK" value="${esc(t.teacher||'')}" placeholder="z. B. OEM" maxlength="10" autocapitalize="characters" style="text-transform:uppercase"></label>
      <label>Dauer (Min.)<input id="eD" type="number" min="1" max="180" step="0.5" value="${t.duration/60}"></label></div>
    <label class="chk"><input type="checkbox" id="eS" ${t.shuffle?'checked':''}> Reihenfolge für jede Person mischen</label>
    <label class="chk"><input type="checkbox" id="eL1" ${t.lock!==false?'checked':''}> Ein Versuch pro Gerät – weitere Person nur mit Geräte-PIN</label>
    <label class="chk"><input type="checkbox" id="eQ" ${t.qr!==false?'checked':''}> QR-Code bei „Code anzeigen“ einblenden (aus, wenn die Klasse die App vom Home-Bildschirm nutzt)</label>
    <label>Eingabeformat der Liste <span class="mut">(abgefragt wird immer Deutsch → Englisch)</span>
      <select id="eO"><option value="de" ${o==='de'?'selected':''}>Deutsch = Englisch</option><option value="en" ${o==='en'?'selected':''}>Englisch = Deutsch</option></select></label>
    <label id="eL">${orderHint(o)}</label>
    <textarea id="eV" rows="16" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="${orderPh(o)}">${esc(txt)}</textarea>
    <div class="acts"><button data-a="save" class="green">Speichern</button><button data-a="anton" title="Bild-Markierungen, Grammatik-Hinweise und Störzeichen entfernen, optionale Teile als Alternativen">ANTON-Liste bereinigen</button><span id="eP" class="mut"></span></div></div>`;
}
function parse(txt){
  const out=[],bad=[];
  txt.split(/\r?\n/).forEach((l,i)=>{
    if(!l.trim()) return;
    let a,b; const t=l.indexOf('\t'), e=l.indexOf('=');
    if(t>=0){a=l.slice(0,t);b=l.slice(t+1)} else if(e>=0){a=l.slice(0,e);b=l.slice(e+1)} else {bad.push(i+1);return}
    a=a.trim(); b=b.replace(/\t/g,' ').trim();
    if(!a||!b){bad.push(i+1);return}
    out.push([a,b]);
  });
  return {out,bad};
}
// Eingabereihenfolge: 'de' = "Deutsch = Englisch", 'en' = "Englisch = Deutsch"
const lastQr=()=>{try{return localStorage.getItem('vt_qr')!=='0'}catch(e){return true}};
const lastTeacher=()=>{try{return localStorage.getItem('vt_teacher')||''}catch(e){return ''}};
const lastOrder=()=>{try{return localStorage.getItem('vt_order')==='en'?'en':'de'}catch(e){return 'de'}};
const orderHint=o=>o==='en'
  ?'Vokabeln – eine pro Zeile: <code>Englisch = Deutsch</code> · mehrere richtige englische Lösungen mit <code>;</code> trennen · zwei Spalten aus Excel (Englisch | Deutsch) einfügen geht auch'
  :'Vokabeln – eine pro Zeile: <code>Deutsch = Englisch</code> · mehrere richtige englische Lösungen mit <code>;</code> trennen · zwei Spalten aus Excel (Deutsch | Englisch) einfügen geht auch';
const orderPh=o=>o==='en'?'school = die Schule&#10;to go; go = gehen':'die Schule = school&#10;gehen = to go; go';
const ord=()=>($('eO')&&$('eO').value==='en')?'en':'de';
// liefert Paare immer als [Deutsch, Englisch]
function readPairs(){const r=parse($('eV').value);if(ord()==='en')r.out=r.out.map(([a,b])=>[b,a]);return r}
function changeOrder(){
  const v=$('eV'), o=ord();
  v.value=v.value.split(/\r?\n/).map(l=>{const p=parse(l).out[0];return p?`${p[1]} = ${p[0]}`:l}).join('\n');
  $('eL').innerHTML=orderHint(o); v.placeholder=orderPh(o).replace('&#10;','\n');
  try{localStorage.setItem('vt_order',o)}catch(e){}
  edDirty=true; upd();
}
// ===== ANTON-Import: Liste im Format "Englisch = Deutsch [[image=…]]" bereinigen =====
const GRAMMAR=/^(no pl\.?|pl\.?|pl\.? .+|sg\.?|informal|formal|infml|fml|AE|BE|AmE|BrE|irr\.?|irregular|n|v|adj|adv|prep)$/i;
const tidy=x=>x.replace(/\s+/g,' ').replace(/\s+([,;:!?)]|\.(?!\.))/g,'$1').replace(/\(\s+/g,'(').trim();
function antonEnglish(en){
  en=en.replace(/\[\[[^\]]*\]\]/g,'').replace(/^[\s·•*\-–]+/,'');
  // Grammatik-Hinweise in Klammern entfernen
  en=en.replace(/\(([^()]*)\)/g,(m,c)=>GRAMMAR.test(c.trim())?'':m);
  let alts=[];
  // Abkürzung in Klammern am Ende, z. B. "bed and breakfast (B & B)" → eigene Alternative
  en=en.replace(/\s*\(([A-Z][A-Z .&]*)\)\s*$/,(m,c)=>{alts.push(c);return ''});
  // optionale Teile: "to climb (up)" → "to climb" + "to climb up"; "(sb)", "(sth to sth)" ebenso
  let vars=[en];
  for(let k=0;k<3&&vars.some(v=>/\([^()]*\)/.test(v));k++)
    vars=vars.flatMap(v=>{const m=v.match(/\(([^()]*)\)/);return m?[v.replace(m[0],''),v.replace(m[0],m[1])]:[v]});
  alts=[...vars,...alts].map(tidy).filter(Boolean);
  // nur auf der Schülertastatur tippbare Varianten behalten (mind. eine bleibt)
  const ok=alts.filter(a=>TYPEABLE.test(a));
  return [...new Set(ok.length?ok:alts)].join('; ');
}
function antonClean(){
  const v=$('eV'); let n=0;
  // Format erzwingen: Englisch = Deutsch (ohne den Inhalt zu tauschen)
  if($('eO').value!=='en'){ $('eO').value='en'; $('eL').innerHTML=orderHint('en'); v.placeholder=orderPh('en').replace('&#10;','\n'); try{localStorage.setItem('vt_order','en')}catch(e){} }
  v.value=v.value.split(/\r?\n/).map(l=>{
    const i=l.indexOf('='); if(i<0) return l.replace(/\[\[[^\]]*\]\]/g,'').trim();
    const en=antonEnglish(l.slice(0,i)), de=tidy(l.slice(i+1).replace(/\[\[[^\]]*\]\]/g,''));
    const out=`${en} = ${de}`; if(out!==l.trim()) n++; return out;
  }).join('\n');
  edDirty=true; upd(); toast(n?`${n} Zeilen bereinigt – bitte kurz prüfen`:'Nichts zu bereinigen');
}
function upd(){const v=$('eV');if(!v)return;const r=readPairs(),u=untypeable(r.out);
  $('eP').textContent=`${r.out.length} Vokabeln erkannt`+(r.bad.length?` · Zeile ${r.bad.join(', ')} ohne „=“`:'')+(u.length?` · ⚠ Vokabel ${u.join(', ')}: englische Lösung enthält Zeichen, die die Schülertastatur nicht hat`:'')}
// Zeichen, die die Schüler-Tastatur (englisch, ohne Umlaute) tippen kann
const TYPEABLE=/^[A-Za-z0-9 \-',.?!()\/;&]*$/;
const untypeable=out=>out.map((x,i)=>TYPEABLE.test(x[1])?0:i+1).filter(Boolean);
const newPin=()=>String(Math.floor(1000+Math.random()*9000));
async function newCode(){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for(;;){let c='';for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];
    // leer = frei; Zugriff verweigert = existiert (fremder Entwurf) → neu würfeln
    try{if(!(await db.ref('vt/tests/'+c).get()).exists()) return c}catch(e){}}
}
async function saveTest(code){
  const title=$('eT').value.trim(), cls=$('eC').value.trim(), teacher=$('eK').value.trim().toUpperCase().slice(0,10), dur=Math.round(parseFloat($('eD').value)*60), shuffle=$('eS').checked, lock=$('eL1').checked, qrOn=$('eQ').checked;
  try{localStorage.setItem('vt_qr',qrOn?'1':'0')}catch(e){}
  const {out,bad}=readPairs(), inputOrder=ord();
  if(!title) return alert('Bitte einen Titel eingeben.');
  if(!(dur>=30)) return alert('Bitte eine gültige Dauer eingeben.');
  if(!out.length) return alert('Keine Vokabeln erkannt.');
  const u=untypeable(out);
  if(u.length&&!confirm(`Vokabel ${u.join(', ')}: Die englische Lösung enthält Zeichen (z. B. Umlaute), die auf der Schülertastatur fehlen. Trotzdem speichern?`)) return;
  if(bad.length&&!confirm(`Zeile(n) ${bad.join(', ')} werden ignoriert (kein „=“). Trotzdem speichern?`)) return;
  const prompts=out.map(x=>x[0]), key=out.map(x=>x[1]);
  try{localStorage.setItem('vt_teacher',teacher)}catch(e){}
  try{
    if(code){
      if(!keysOk) return;
      if(Object.keys(subs).length&&!confirm('Es gibt schon Teilnahmen. Änderungen an Anzahl/Reihenfolge der Vokabeln verfälschen die Auswertung. Trotzdem speichern?')) return;
      await db.ref('vt/keys/'+code).set(key);
      await db.ref('vt/tests/'+code).update({title,cls,teacher,duration:dur,shuffle,lock,qr:qrOn,prompts,inputOrder});
      edDirty=false; toast('Gespeichert');
    } else {
      const c=await newCode();
      await db.ref('vt/tests/'+c).set({title,cls,teacher,duration:dur,shuffle,lock,qr:qrOn,prompts,inputOrder,status:'draft',createdAt:TS,...ownerData()});
      await db.ref('vt/keys/'+c).set(key); await db.ref('vt/pins/'+c).set(newPin());
      select(c); toast('Gespeichert – Code '+c);
    }
  }catch(e){alert('Fehler beim Speichern: '+(e.code||e.message))}
}

    <div id="det"></div><h3>Wortanalyse</h3><div class="tw"><table class="res" id="ana"></table></div>`;

function evalSub(id){
  const s=subs[id], a=s.answers||[], g=grades[id]||{}, lrs=g.lrs===true;
  // LRS: Rechtschreibfehler (sonst ½) zählen nicht – ½ wird ✓, auch bei übernommenen Korrekturregeln
  const L=v=>lrs&&v===.5?0:v;
  const items=keys.map((k,i)=>{const ans=a[i]||'', auto=L(score(ans,k));
    let rule=norm(ans)&&accept[i]?accept[i][akey(ans)]:undefined; if(rule!=null) rule=L(rule);
    const ov=g[i]!=null?g[i]:rule!=null?rule:null;
    return {i,ans,auto,ov,rule:g[i]==null&&rule!=null,val:ov==null?auto:ov}});
  return {items,lrs,err:items.reduce((x,y)=>x+y.val,0),filled:items.filter(x=>norm(x.ans)).length};
}
function stat(s,t){
  const dur=t.duration*1000;
  if(s.status==='submitted'){const used=s.submittedAt-s.startedAt;return {txt:'abgegeben'+(s.auto?' (auto)':''),cls:'ok',dur:fmt(used/1000),late:used>dur+15000}}
  const rem=(s.startedAt||0)+dur-(Date.now()+off);
  return rem>0?{txt:'läuft · '+fmt(rem/1000),cls:'run',dur:'–'}:{txt:'keine Abgabe',cls:'bad',dur:'–'};
}
// Mehrfachversuche erkennen: gleiches Gerät bzw. gleicher Name (ohne Groß/Klein, Satzzeichen, Leerzeichen)
const nameKey=n=>String(n||'').toLowerCase().replace(/[^a-z0-9äöüß]/g,'');
const byStart=(a,b)=>(subs[a].startedAt||0)-(subs[b].startedAt||0);
function flags(id){
  const s=subs[id], all=Object.keys(subs), out=[];
  if(s.dev){const same=all.filter(x=>subs[x].dev===s.dev).sort(byStart), k=same.indexOf(id);
    if(k>0) out.push(s.unlocked?{t:`${k+1}. Person auf Gerät (PIN)`,w:0}:{t:`${k+1}. Versuch auf Gerät`,w:1})}
  const nk=nameKey(s.name), sameN=all.filter(x=>nameKey(subs[x].name)===nk).sort(byStart);
  if(sameN.length>1) out.push({t:`Name ${sameN.indexOf(id)+1}/${sameN.length}`,w:1});
  return out;
}
const flagHtml=id=>{const s=subs[id];return `<span class="mut">${s.dev?'#'+esc(s.dev):'–'}</span> `+flags(id).map(x=>`<span class="${x.w?'warn':'mut'}">${esc(x.t)}</span>`).join(' · ')};
const flagTxt=id=>flags(id).map(x=>x.t).join(' · ');
const sortedIds=(onlyDone)=>Object.keys(subs).filter(id=>!onlyDone||subs[id].status==='submitted')
  .sort((a,b)=>(subs[a].name||'').localeCompare(subs[b].name||'','de',{sensitivity:'base'}));
function renderRows(){
  const rb=$('rb'), t=tests[sel]; if(!rb||!t||!keysOk) return;
  const n=keys.length, ids=sortedIds(false);
  rb.innerHTML=ids.map(id=>{const s=subs[id],e=evalSub(id),st=stat(s,t);
    return `<tr data-s="${id}" class="${id===selSub?'sel':''}"><td><b>${esc(s.name)}</b>${e.lrs?' <span class="badge b0" title="Bewertung nach LRS-Regeln">LRS</span>':''}</td><td><span class="st ${st.cls}">${st.txt}</span></td>
      <td>${e.filled}/${n}</td><td><b>${f(e.err)}</b></td><td>${f(n-e.err)}/${n}</td>
      <td>${s.blur?`<span class="warn">${s.blur}</span>`:'0'}</td><td class="${st.late?'warn':''}" title="${st.late?'Zeitlimit überschritten':''}">${st.dur}</td><td>${flagHtml(id)}</td></tr>`}).join('')
    ||'<tr><td colspan="8" class="mut">Noch keine Teilnahmen.</td></tr>';
  const done=sortedIds(true), running=ids.length-done.length;
  const avg=done.length?done.reduce((x,id)=>x+evalSub(id).err,0)/done.length:0;
  $('sum').textContent=`${done.length} abgegeben · ${running} offen`+(done.length?` · Ø ${avg.toFixed(1).replace('.',',')} Fehler`:'');
}

function renderAna(){
  const a=$('ana'); if(!a||!keysOk) return;
  const done=sortedIds(true);
  if(!done.length){a.innerHTML='<tbody><tr><td class="mut">Noch keine Abgaben.</td></tr></tbody>';return}
  const ev=done.map(evalSub), P=tests[sel].prompts||[];
  const rows=keys.map((k,i)=>({i,k,p:P[i],q:ev.reduce((x,e)=>x+e.items[i].val,0)/ev.length})).sort((x,y)=>y.q-x.q);
  a.innerHTML='<thead><tr><th>#</th><th>Deutsch</th><th>Englisch</th><th>Fehlerquote</th></tr></thead><tbody>'+

}
// Korrekturregel für identische Antworten (gleiche Vokabel, exakt gleiche Schreibweise inkl. Groß/Klein)
const akey=ans=>encodeURIComponent(norm(ans)).replace(/\./g,'%2E');
const syncOn=()=>{try{return localStorage.getItem('vt_sync')!=='0'}catch(e){return true}};
function cycle(i){
  const e=evalSub(selSub), it=e.items[i], seq=[0,.5,1], nx=seq[(seq.indexOf(it.val)+1)%3], v=nx===it.auto?null:nx;
  // LRS-Abgaben: Korrektur gilt nur für diese Abgabe, nie für andere
  if(e.lrs||!syncOn()||!norm(it.ans)){db.ref(`vt/grades/${sel}/${selSub}/${i}`).set(v);return}
  const k=akey(it.ans), upd={[`vt/accept/${sel}/${i}/${k}`]:v};
  let others=0;
  Object.keys(subs).forEach(id=>{const a=(subs[id].answers||[])[i];
    if(a!=null&&norm(a)&&akey(a)===k&&!(id!==selSub&&(grades[id]||{}).lrs===true)){upd[`vt/grades/${sel}/${id}/${i}`]=null;if(id!==selSub)others++}});
  db.ref().update(upd);
  if(others) toast(`Auch bei ${others} weiteren Abgabe${others>1?'n':''} mit „${norm(it.ans)}“ übernommen`);
}
setInterval(()=>{if(sel&&tab==='res'&&$('rb')&&Object.values(subs).some(s=>s.status!=='submitted'))renderRows()},1000);

function csv(){
  const t=tests[sel], n=keys.length, P=t.prompts||[];
  // Formel-Injektion verhindern: Felder, die mit = + - @ beginnen, als Text kennzeichnen
  const q=v=>{let x=String(v??'');if(/^[=+\-@\t\r]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};
  const head=['Name','Status','Fehler','Punkte','Max','App-Wechsel','Start','Abgabe','Gerät','Hinweis','LRS'];
  for(let i=0;i<n;i++) head.push(`${i+1}: ${P[i]}`,`${i+1}: Wertung`);
  const rows=[head];
  sortedIds(false).forEach(id=>{const s=subs[id],e=evalSub(id);
    const r=[s.name,s.status==='submitted'?(s.auto?'abgegeben (auto)':'abgegeben'):'offen',f(e.err),f(n-e.err),n,s.blur||0,dt(s.startedAt),dt(s.submittedAt),s.dev||'',flagTxt(id),e.lrs?'ja':''];
    e.items.forEach(x=>r.push(x.ans,f(x.val))); rows.push(r)});
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`Vokabeltest_${t.teacher?t.teacher+'_':''}${(t.title||sel).replace(/[^\wäöüÄÖÜß-]+/g,'_')}_${sel}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function printAll(){
  const t=tests[sel], P=t.prompts||[], ids=sortedIds(true), n=keys.length;
  if(!ids.length) return alert('Noch keine Abgaben.');
  $('print').innerHTML=ids.map(id=>{const s=subs[id],e=evalSub(id);
    return `<div class="pg"><div class="pgh">${logo()}<div class="r">CJD Königswinter<br>Vokabeltest Englisch${t.teacher?' · '+esc(t.teacher):''}</div></div>
      <h2>${esc(t.title)}</h2><p>${esc(s.name)} · ${esc(t.cls||'')} · ${s.submittedAt?new Date(s.submittedAt).toLocaleDateString('de-DE'):''}</p>
      <p><b>${f(e.err)} Fehler</b> – ${f(n-e.err)} von ${n} Punkten</p>
      <table><tr><th>#</th><th>Deutsch</th><th>Deine Antwort</th><th>Englisch (Lösung)</th><th></th></tr>
      ${e.items.map(x=>`<tr><td>${x.i+1}</td><td>${esc(P[x.i])}</td><td>${esc(x.ans)}</td><td>${esc(keys[x.i])}</td><td>${sym(x.val)}</td></tr>`).join('')}</table>
      <div class="sig"><div class="sigt">Kenntnisnahme der Erziehungsberechtigten</div>
        <p>Ich habe das Ergebnis des Vokabeltests zur Kenntnis genommen.</p>
        <div class="sigr"><div><span></span>Datum</div><div><span></span>Unterschrift einer/eines Erziehungsberechtigten</div></div></div></div>`}).join('');
  // auf Logo warten (max. 2 s), dann drucken
  const imgs=[...$('print').querySelectorAll('img')].filter(i=>!i.complete);
  Promise.race([Promise.all(imgs.map(i=>new Promise(r=>{i.onload=i.onerror=r}))),new Promise(r=>setTimeout(r,2000))]).then(()=>window.print());
}

async function mkUser(){
  const e=$('nE').value.trim(), p=$('nP').value.trim(), er=$('tErr');
  if(!/^\S+@\S+\.\S+$/.test(e)) return er.textContent='Bitte gültige E-Mail eingeben.';
  if(p.length<6) return er.textContent='Passwort: mindestens 6 Zeichen.';
  er.textContent='Lege an …';
  try{
    const c=await creator().createUserWithEmailAndPassword(e,p), uid=c.user.uid;
    await creator().signOut();
    await db.ref().update({[`vt/teachers/${uid}`]:true,[`vt/users/${uid}`]:e});
    newCred={e,p}; renderPane(); toast('Zugang angelegt');
  }catch(x){
    er.textContent=({'auth/email-already-in-use':'Diese E-Mail hat schon einen Zugang. Die Person soll sich einmal anmelden, dann erscheint sie unten und kann freigeschaltet werden.',
      'auth/admin-restricted-operation':'Anlegen ist in Firebase gesperrt: Authentication → Einstellungen → Nutzeraktionen → „Erstellen (Registrierung) aktivieren“ einschalten.',
      'auth/operation-not-allowed':'Anlegen ist in Firebase gesperrt: Authentication → Einstellungen → Nutzeraktionen → „Erstellen (Registrierung) aktivieren“ einschalten.',
      'auth/invalid-email':'Ungültige E-Mail-Adresse.','auth/weak-password':'Passwort zu schwach (mind. 6 Zeichen).'})[x.code]||('Fehler: '+(x.code||x.message));
  }
}

$('pane').addEventListener('click',async e=>{
  const b=e.target.closest('[data-a],[data-t],[data-g],[data-s]'); if(!b) return;
  if(b.dataset.t){if(tab==='edit'&&edDirty&&b.dataset.t!=='edit'&&!confirm('Ungespeicherte Änderungen verwerfen?'))return;
    tab=b.dataset.t;edDirty=false;renderHead();renderBody();return}
  if(b.dataset.g!=null){cycle(+b.dataset.g);return}
  if(b.dataset.s){selSub=b.dataset.s;renderRows();renderDetail();$('det').scrollIntoView({behavior:'smooth',block:'start'});return}
  const r=sel&&db.ref('vt/tests/'+sel);
  switch(b.dataset.a){
    case 'open': r.update({status:'open',closedAt:null}); break;
    case 'close': if(confirm('Test beenden? Alle laufenden Tests werden sofort abgegeben.')) r.update({status:'closed',closedAt:TS}); break;
    case 'big': showBig(); break;
    case 'dup': dup(); break;
    case 'del': del(); break;
    case 'save': saveTest(sel); break;
    case 'csv': csv(); break;
    case 'lrs': db.ref(`vt/grades/${sel}/${selSub}/lrs`).set(b.checked?true:null); break;
    case 'anton': antonClean(); break;
    case 'mkuser': mkUser(); break;
    case 'copyuid': navigator.clipboard&&navigator.clipboard.writeText(me.uid).then(()=>toast('UID kopiert')); break;
    case 'allow': db.ref('vt/teachers/'+b.dataset.u).set(true); break;
    case 'block': if(confirm(`${users[b.dataset.u]||'Diese Lehrkraft'} sperren? Sie sieht danach keine Tests mehr.`)) db.ref('vt/teachers/'+b.dataset.u).remove(); break;
    case 'reset': auth.sendPasswordResetEmail(users[b.dataset.u]).then(()=>toast('Mail zum Zurücksetzen verschickt'),x=>alert('Fehler: '+(x.code||x.message))); break;
    case 'copycred': navigator.clipboard&&navigator.clipboard.writeText(`Vokabeltests CJD Königswinter\nAdresse: ${siteUrl('lehrer.html')}\nE-Mail: ${newCred.e}\nPasswort: ${newCred.p}\nBitte nach der ersten Anmeldung nicht weitergeben.`).then(()=>toast('Kopiert')); break;
    case 'hidecred': newCred=null; renderPane(); break;
    case 'sync': try{localStorage.setItem('vt_sync',b.checked?'1':'0')}catch(e){} break;
    case 'print': printAll(); break;
    case 'closedet': selSub=null; renderRows(); renderDetail(); break;
    case 'delsub':
      if(confirm(`Teilnahme von „${subs[selSub].name}“ löschen?`)){
        const id=selSub; selSub=null;
        await db.ref().update({[`vt/subs/${sel}/${id}`]:null,[`vt/grades/${sel}/${id}`]:null});
      } break;
  }
});
</script>
</body>
</html>
